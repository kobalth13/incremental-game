.yahtzee-halo { position: absolute; z-index: 1; inset: 0; pointer-events: none; opacity: 0; filter: drop-shadow(0 0 3px #eeb46d) drop-shadow(0 0 5px #d3964480); transition: opacity .18s ease; }
.yahtzee-halo::before { content: ''; position: absolute; inset: 0; clip-path: polygon(evenodd, var(--plate-halo)); background: #efbf7a; }
#antique-dice-action:not([hidden]):not(:disabled) + .yahtzee-halo { opacity: .72; }
.yahtzee-result { position: absolute; left: 0; top: calc(100% + var(--result-gap)); width: 100%; height: 100%; padding: 2.4cqw 4cqw; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4cqw; border: 1px solid #997047; border-radius: 4.5cqw; background: #21170fef; box-shadow: 0 2px 9px #0008, inset 0 0 0 1px #d9af7733; }

}

@keyframes result-tumble { from { transform: rotate(-10deg); } to { transform: rotate(8deg); } }

<script>
(()=>{

const devState=get('dev-state'),prev=get('prev'),next=get('next'),reset=get('reset'),wheelcount=get('wheel-count');

const journal=get('journal'),fc=get('filter-click'),fd=get('filter-dice'),total=get('total'),cps=get('cps');

const pipMap={1:[[50,50]],2:[[26,26],[74,74]],3:[[26,26],[50,50],[74,74]],4:[[26,26],[74,26],[26,74],[74,74]],5:[[26,26],[74,26],[50,50],[26,74],[74,74]],6:[[26,24],[74,24],[26,50],[74,50],[26,76],[74,76]]};

const WHEEL_COST = campaign ? 1 : 5;
const STAMINA_REGEN = campaign ? 0.5 : 0.1;
let phase=0,steps=0,clicks=0,times=[],readyAt=0,rollTimer=null;
let resourcesUnlocked=false,stamina=1,maxStamina=10,vitality=2,maxVitality=10,mana=0,maxMana=10,manaUnlocked=false,level=0,currentExp=0,lastResourceTime=performance.now(),lastFatigueNotice=performance.now()-2000;
let availableAttributePoints=0,availableTalentPoints=0,staminaProtectedUntil=0;
// V0.9: paramètres d'équilibrage PROVISOIRES, distincts des décisions de Pierre.
const STUDY_COST=3,STUDY_DURATION=12_000,STUDY_COOLDOWN=20_000;
let intelligence=0,knowledgeLevel=0,studyEndAt=0,studyReadyAt=0,knowledgeMode=false;
// Huit catégories, dans l'ordre croissant décidé pour les 5 secondes par rang.
const ranks={"Paire":1,"Double paire":2,"Brelan":3,"Carré":4,"Full":5,"Petite suite":6,"Grande suite":7,"Yahtzee":8};
function targetExp(lvl){return [100,200,600][lvl]??null;} // Paliers ultérieurs non définis
function fmt1(v){return Math.max(0,v).toFixed(1).replace('.',',');}
function renderResources(){
 staminaValue.textContent=fmt1(stamina)+' / '+maxStamina;
 staminaFill.style.width=Math.min(100,100*stamina/maxStamina)+'%';
 vitalityValue.textContent=fmt1(vitality)+' / '+maxVitality;

 manaCard.hidden=!manaUnlocked;

 actionsValue.textContent=staminaValue.textContent;
 actionsLiquid.style.height=staminaFill.style.width;

 const goal=targetExp(level);

 devLevel.disabled=phase<1||goal===null;
 attributePointsEl.textContent=availableAttributePoints.toLocaleString('fr-BE');
 talentPointsEl.textContent=availableTalentPoints.toLocaleString('fr-BE');
 const remaining=Math.max(0,(staminaProtectedUntil-performance.now())/1000);
 staminaCost.textContent=(phase===0||remaining>0?0:WHEEL_COST)+' / cran';
 renderEffects(remaining);
 intelligenceRow.hidden=availableAttributePoints===0&&intelligence===0;

 allocateIntelligence.disabled=campaignFinished||passageRequested||phase<1||availableAttributePoints<1;
}
function unlockResources(){
 if(resourcesUnlocked)return;
 resourcesUnlocked=true;
 lastResourceTime=performance.now();
 renderResources();
}
function updateResources(){
 const now=performance.now();
 const elapsed=Math.max(0,Math.min(60,(now-lastResourceTime)/1000));
 lastResourceTime=now;
 if(!campaignFinished&&!passageRequested&&phase>=1&&resourcesUnlocked){stamina=Math.min(maxStamina,stamina+STAMINA_REGEN*elapsed);renderResources();}
}
function awardExp(amount,source){
 if(!resourcesUnlocked||amount<=0)return;
 currentExp+=amount;
 const goal=targetExp(level);
 if(goal!==null&&currentExp>=goal){
   level++;currentExp=0; // Retour à zéro sur les seuils connus. Le surplus des futurs gains reste à spécifier.
   availableAttributePoints+=5;
   availableTalentPoints+=2;
   log('Niveau '+level+' atteint ! +5 points d’attributs, +2 points de talents ('+source+')','system',true);
 }
 renderResources();
}
function resetResources(){
 resourcesUnlocked=false;stamina=campaign?10:1;maxStamina=10;vitality=2;maxVitality=10;mana=0;maxMana=10;manaUnlocked=false;
 level=0;currentExp=0;availableAttributePoints=0;availableTalentPoints=0;staminaProtectedUntil=0;lastResourceTime=performance.now();lastFatigueNotice=performance.now()-2000;
 intelligence=0;knowledgeLevel=0;studyEndAt=0;studyReadyAt=0;knowledgeMode=false;
 rightPanel.classList.remove('knowledge-mode');knowledgeNotes.replaceChildren();knowledgeToggle.hidden=true;journalTitle.textContent='Journal';
 attributesBody.hidden=false;attributesToggle.setAttribute('aria-expanded','true');attributesChevron.textContent='▾';
 renderResources();
}
attributesToggle.addEventListener('click',()=>{
 const opened=attributesToggle.getAttribute('aria-expanded')==='true';
 attributesToggle.setAttribute('aria-expanded',String(!opened));attributesBody.hidden=opened;
 attributesChevron.textContent=opened?'▸':'▾';
});
allocateIntelligence.addEventListener('click',()=>{
 if(campaignFinished||passageRequested||phase<1||availableAttributePoints<1)return;
 availableAttributePoints--;intelligence++;
 const firstAwakening=!manaUnlocked;
 if(firstAwakening){manaUnlocked=true;mana=Math.max(mana,1);log(lore.awakenReserve,'system',true);}
 renderResources();renderStudy();log('Intelligence +1 : votre étude gagne en rapidité.','system',true);
});
knowledgeToggle.addEventListener('click',()=>{
 if(knowledgeLevel<1)return;
 knowledgeMode=!knowledgeMode;
 rightPanel.classList.toggle('knowledge-mode',knowledgeMode);
 journalTitle.textContent=knowledgeMode?'Connaissances':'Journal';
 knowledgeToggle.textContent=knowledgeMode?'← Journal':'Connaissances';
});
function renderEffects(remainSeconds){
 const active=remainSeconds>0;
 effectEndurance.hidden=!active;
 effectsBand.classList.toggle('visible',active);
 if(!active)return;
 const display=remainSeconds>60?Math.ceil(remainSeconds/60)+'m':Math.ceil(remainSeconds)+'s';
 effectTime.textContent=display;
 effectEndurance.style.background='conic-gradient(#8db892 '+Math.max(0,100*(remainSeconds/40))+'%, #34453b 0)';
 effectEndurance.setAttribute('aria-label','Protection d’endurance : '+display+' restant');
}
function studyDuration(){return Math.max(5000,STUDY_DURATION-intelligence*1000);}
function renderStudy(){
 const now=performance.now(),active=phase>=1&&studyEndAt>now;
 showObjectiveStudyTime(now);
 studyHint.hidden=phase<1;
 if(phase<1){studyHint.textContent='L’étude se débloque au premier tour de roue.';return;}
 if(knowledgeLevel>=knowledgeStages.length){studyHint.textContent='Études actuelles terminées';return;}
 if(active){studyHint.textContent='Étude : '+Math.ceil((studyEndAt-now)/1000)+' s';return;}
 if(studyReadyAt>now){studyHint.textContent='Reprise : '+Math.ceil((studyReadyAt-now)/1000)+' s';return;}
 studyHint.textContent='Étudier · '+STUDY_COST+' END';
}
function startStudy(){
 if(campaignFinished||passageRequested||phase<1||knowledgeLevel>=knowledgeStages.length)return;
 const now=performance.now();
 if(studyEndAt>now||studyReadyAt>now)return;
 updateResources();
 if(stamina+1e-6<STUDY_COST){log('Endurance insuffisante pour étudier ('+STUDY_COST+' nécessaires).','system');return;}
 stamina-=STUDY_COST;studyEndAt=now+studyDuration();studyReadyAt=now+STUDY_COOLDOWN;
 renderResources();renderStudy();updateSceneActions();log(lore.startStudy,'system');
}
function completeStudy(){
 if(campaignFinished||passageRequested||!studyEndAt||performance.now()<studyEndAt)return;
 studyEndAt=0;
 if(knowledgeLevel>=knowledgeStages.length)return;
 const item=knowledgeStages[knowledgeLevel++];
 const note=document.createElement('div');note.className='knowledge-note';
 const heading=document.createElement('strong');heading.textContent=item.label;
 const content=document.createElement('span');content.textContent=item.text;
 note.append(heading,content);knowledgeNotes.appendChild(note);
 knowledgeToggle.hidden=false;
 log('Étude terminée — '+item.label+' consignée dans les Connaissances.','system',true);
 updateObjectives();
 renderStudy();
}
devStamina.addEventListener('click',()=>{
 if(phase<1)return;updateResources();stamina=Math.min(maxStamina,stamina+5);renderResources();
 log('DEV : +5 endurance (test)','system');
});
devLevel.addEventListener('click',()=>{
 if(phase<1||targetExp(level)===null)return;
 awardExp(targetExp(level)-currentExp,'test DEV');
});
function clock(){return new Date().toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});}
function visible(kind){return kind==='click'?fc.checked:kind==='dice'?fd.checked:true;}
function log(msg,kind='lore',success=false){const el=document.createElement('div');el.className='entry '+kind+(success?' success':'');el.dataset.kind=kind;el.textContent=(kind==='lore'?'':clock()+' ')+msg;el.hidden=!visible(kind);journal.appendChild(el);if(!el.hidden)journal.scrollTop=journal.scrollHeight;}
function applyFilters(){journal.querySelectorAll('.entry').forEach(e=>e.hidden=!visible(e.dataset.kind));journal.scrollTop=journal.scrollHeight;}
fc.addEventListener('change',applyFilters);fd.addEventListener('change',applyFilters);
function wheelRender(instant=false){
  art.classList.toggle('has-turned', steps > 0);
  wheelcount.textContent = 'Roue = ' + Math.floor(steps / 10) + '.' + steps % 10;
  if (instant) wheelimage.classList.add('instant');
  wheelimage.style.transform = `rotate(${steps * 36}deg)`;
  if (instant) {
    void wheelimage.offsetWidth;
    wheelimage.classList.remove('instant');
  }
}
function refresh(){
 const showResources = campaign || phase>=1;
 game.classList.toggle('has-rpg',showResources);
 stage.classList.toggle('has-rpg',showResources);
 stage.classList.toggle('has-info',campaign||phase>=2);
 room.classList.add('lit');
 room.classList.toggle('has-dice',phase>=1);
 devStamina.disabled=phase<1;
 devLevel.disabled=phase<1||targetExp(level)===null;
 devState.textContent=testStates[phase];
 prev.disabled=phase===0;next.disabled=phase===2;
 wheelRender();renderResources();renderStudy();cooldown();updateSceneActions();
}
function gotoPhase(n,why=''){
 const target=Math.min(2,Math.max(0,n));if(target===phase)return;
 if(target===0){
  restart();
  return;
 }
 phase=target;
 steps=Math.max(steps,10);
 wheelRender(true);
 unlockResources();
 refresh();
 if(why==='cheat')log('DEV · '+testStates[phase],'system');
 if(why==='dice')log('Combinaison admissible : informations débloquées.','system',true);
}
function stepWheel(){
 if(campaignFinished||passageRequested)return;
 if(phase>=1){
  updateResources();
  const enduranceCost=performance.now()<staminaProtectedUntil?0:WHEEL_COST;
  if(stamina+1e-6<enduranceCost){
    if(performance.now()-lastFatigueNotice>1800){log('Endurance insuffisante : '+fmt1(stamina)+' / '+enduranceCost+' nécessaires.','system');lastFatigueNotice=performance.now();}
    return;
  }
  stamina=Math.max(0,stamina-enduranceCost);renderResources();
 }
 const previousTours = Math.floor(steps/10);
 steps+=upgrades.force?2:1;clicks++;times.push(performance.now());
 total.textContent=clicks.toLocaleString('fr-BE');wheelRender();rate();
 log('+1 clic ('+clicks+')','click');
 if(Math.floor(steps/10)>previousTours){
   if(antiqueUpgrades) parts++;
   if(reviewMode!=='roue'){
    if(phase===0){phase=1;unlockResources();refresh();log(lore.dice);}
    awardExp(1,'tour de roue');
    updateObjectives();
   }
   refreshStationMenu();
 }
}
function rate(){const t=performance.now();times=times.filter(v=>t-v<1000);cps.textContent=times.length.toFixed(1).replace('.',',');}
function combination(a){
 const c=Array(7).fill(0);a.forEach(x=>c[x]++);
 const counts=c.slice(1);
 const m=Math.max(...counts);
 const unique=[...new Set(a)].sort((x,y)=>x-y);
 const straight=unique.join(',');
 const hasFourConsecutive=unique.some(v=>v<=3&&[v,v+1,v+2,v+3].every(n=>unique.includes(n)));
 const found=[];
 if(m>=2)found.push('Paire');
 if(counts.filter(x=>x===2).length>=2)found.push('Double paire');
 if(m>=3)found.push('Brelan');
 if(m>=4)found.push('Carré');
 if(counts.includes(3)&&counts.includes(2))found.push('Full');
 if(hasFourConsecutive)found.push('Petite suite');
 if(straight==='1,2,3,4,5'||straight==='2,3,4,5,6')found.push('Grande suite');
 if(m===5)found.push('Yahtzee');
 return found.length?found.reduce((a,b)=>ranks[b]>ranks[a]?b:a):'Aucune combinaison';
}
function protectStamina(hand){
 const rank=ranks[hand]||0;
 if(!rank)return;
 const duration=(rank+(upgrades.reward?1:0))*5000;
 // Une réussite rafraîchit la protection sans raccourcir la durée encore active.
 const newDeadline=performance.now()+duration;
 if(newDeadline>=staminaProtectedUntil)staminaProtectedUntil=newDeadline;
 renderResources();
 log('Endurance protégée pendant '+(duration/1000)+' s ('+hand+').','system',true);
}
const diceCooldownMs = 10_000;
// Figures retenues dans moins de 5 % des lancers avec le classement actuel.
const rareFigures = new Set(['Carré', 'Full', 'Grande suite', 'Yahtzee']);

function cooldown() {
  const remaining = Math.max(0, readyAt - performance.now());
  if (!remaining) readyAt = 0;
  const charging = phase >= 1 && remaining > 0;
  diceAction.disabled = campaignFinished || passageRequested || phase < 1 || charging;
  diceAction.classList.toggle('cooling', charging);
  diceAction.style.setProperty('--recharge', charging ? String(1 - remaining / diceCooldownMs) : '0');
}

function arrangedDice(values, hand) {
  const faces = [...new Set(values)].sort((a, b) => a - b);
  const matching = count => faces.filter(face => values.filter(value => value === face).length === count);
  let groups = [];

  switch (hand) {
    case 'Paire': groups = [Array(2).fill(matching(2)[0])]; break;
    case 'Double paire': groups = matching(2).map(face => [face, face]); break;
    case 'Brelan': groups = [Array(3).fill(matching(3)[0])]; break;
    case 'Carré': groups = [Array(4).fill(matching(4)[0])]; break;
    case 'Full': groups = [Array(3).fill(matching(3)[0]), Array(2).fill(matching(2)[0])]; break;
    case 'Yahtzee': groups = [values.slice()]; break;
    case 'Petite suite': {
      const start = faces.find(face => [face + 1, face + 2, face + 3].every(next => faces.includes(next)));
      groups = [[start, start + 1, start + 2, start + 3]];
      break;
    }
    case 'Grande suite': groups = [faces]; break;
  }

  const rest = values.slice();
  const ordered = groups.flatMap((group, index) => group.map(face => {
    rest.splice(rest.indexOf(face), 1);
    return { face, group: index + 1 };
  }));
  return ordered.concat(rest.map(face => ({ face, group: 0 })));
}

function showDice(values, hand) {
  showDigitalDice(values);
  const result = arrangedDice(values, hand);
  showOrbitalDice(result.map(({face}) => face));
  result.forEach(({ face, group }, index) => {
    const die = dice[index];
    setFace(die, face);
    die.dataset.group = String(group);
  });
  diceSummary.textContent = hand;
  diceAnnouncement.textContent = `${hand} — ${result.map(({face}) => face).join(', ')}`;
  diceResult.hidden = false;
  delete diceResult.dataset.celebration;
  if (rareFigures.has(hand)) {
    void diceResult.offsetWidth;
    diceResult.dataset.celebration = hand === 'Yahtzee' ? 'yahtzee' : 'rare';
  }
}

function showDigitalDice(values) {
  if (!digitalScreen) return;
  digitalScreen.hidden = false;
  digitalDice.forEach((die, index) => setFace(die, values[index]));
}

function showOrbitalDice(values) {
  if (!orbitalProjector) return;
  orbitalProjector.hidden = false;
  orbitalDice.forEach((die, index) => setFace(die, values[index]));
}

function resetDice(clearResult = true) {
  readyAt = 0;
  if (rollTimer !== null) clearInterval(rollTimer);
  rollTimer = null;
  if (!clearResult && !diceResult.classList.contains('rolling')) {
    cooldown();
    return;
  }
  diceResult.hidden = true;
  diceResult.classList.remove('rolling');
  delete diceResult.dataset.celebration;
  diceSummary.textContent = '';
  diceAnnouncement.textContent = '';
  if (digitalScreen) digitalScreen.hidden = true;
  if (orbitalProjector) {
    orbitalProjector.hidden = true;
    orbitalProjector.classList.remove('rolling');
  }
  cooldown();
}

function diceRoll() {
  if (campaignFinished || passageRequested || phase < 1 || readyAt > performance.now()) return;
  readyAt = performance.now() + diceCooldownMs;
  cooldown();
  if (rollTimer !== null) clearInterval(rollTimer);
  delete diceResult.dataset.celebration;
  dice.forEach(die => { die.dataset.group = '0'; });
  diceSummary.textContent = 'Lancer…';
  diceAnnouncement.textContent = '';
  diceResult.hidden = false;
  diceResult.classList.add('rolling');

  const rollFaces = () => dice.map(() => Math.floor(Math.random() * 6) + 1);
  let values = rollFaces();
  if (upgrades.luck && Math.random() < .15) {
    const second = rollFaces();
    if ((ranks[combination(second)] ?? 0) > (ranks[combination(values)] ?? 0)) values = second;
  }
  showDigitalDice(values);
  showOrbitalDice(values);
  orbitalProjector?.classList.add('rolling');
  const settleAt = performance.now() + (orbitalProjector ? 1040 : 650);
  rollTimer = setInterval(() => {
    if (performance.now() < settleAt) {
      const preview = rollFaces();
      preview.forEach((face, index) => setFace(dice[index], face));
      showDigitalDice(preview);
      showOrbitalDice(preview);
      return;
    }
    clearInterval(rollTimer);
    rollTimer = null;
    diceResult.classList.remove('rolling');
    orbitalProjector?.classList.remove('rolling');
    const hand = combination(values);
    const success = Boolean(ranks[hand]);
    showDice(values, hand);
    log('Dés : ' + values.join('-') + ' — ' + hand, 'dice', success);
    if (success) protectStamina(hand);
    completedRolls++;
    updateObjectives();
    if (!campaign && phase === 1 && ['Brelan', 'Full', 'Carré', 'Grande suite', 'Yahtzee'].includes(hand)) gotoPhase(2, 'dice');
  }, 65);
}

const objectives = get('objectives');
const objectiveAction = get('objective-action');
const objectiveStatus = get('objective-status');
const objectiveHint = get('objective-hint');
const objectiveStudyTime = get('objective-study-time');
const objectiveCounters = ['turns', 'studies', 'rolls'].map(name => get('objective-' + name));
const targets = era.progression.goals;
let completedRolls = 0;
let campaignFinished = false;
let passageRequested = false;
let readyToAdvance = false;
let arrivalCharacter = campaign && document.documentElement.dataset.character
  ? JSON.parse(decodeURIComponent(document.documentElement.dataset.character))
  : null;

function updateObjectives() {
  if (!campaign) return;
  const counts = [Math.floor(steps / 10), knowledgeLevel, completedRolls];
  readyToAdvance = counts.every((count, index) => count >= targets[index]);
  objectiveHint.hidden = phase > 0;
  objectiveCounters.forEach((counter, index) => {
    counter.textContent = Math.min(counts[index], targets[index]) + ' / ' + targets[index];
    counter.dataset.done = String(counts[index] >= targets[index]);
  });
  objectiveAction.disabled = !readyToAdvance || passageRequested;
  objectiveAction.textContent = campaignFinished ? 'Nouvelle partie'
    : era.number === 5 ? 'Achever le voyage' : 'Passer à l’ère suivante';
  objectiveStatus.textContent = campaignFinished ? 'Campagne terminée. ' + era.progression.complete
    : readyToAdvance ? era.progression.complete : '';
}

function showObjectiveStudyTime(now) {
  if (!campaign) return;
  const studying = studyEndAt > now;
  const available = knowledgeLevel < targets[1] && !campaignFinished && !passageRequested;
  objectiveStudyTime.hidden = !available || (!studying && studyReadyAt <= now);
  if (objectiveStudyTime.hidden) return;
  const text = studying ? 'Étude en cours · ' + Math.ceil((studyEndAt - now) / 1000) + ' s'
    : 'Reprise de l’étude dans ' + Math.ceil((studyReadyAt - now) / 1000) + ' s';
  if (objectiveStudyTime.textContent !== text) objectiveStudyTime.textContent = text;
}

objectiveAction.addEventListener('click', () => {
  if (!campaign || !readyToAdvance || passageRequested) return;
  if (campaignFinished) {
    passageRequested = true;
    updateObjectives();
    parent.postMessage({type: 'campaign-restart'}, '*');
    return;
  }
  if (era.number === 5) {
    campaignFinished = true;
    studyEndAt = 0;
    resetDice(false);
    log(era.progression.complete, 'lore', true);
    refresh();
    updateObjectives();
    return;
  }
  passageRequested = true;
  resetDice(false);
  updateObjectives();
  refresh();
  parent.postMessage({
    type: 'campaign-advance',
    character: {level, currentExp, vitality, intelligence, availableAttributePoints, availableTalentPoints, mana, manaUnlocked},
  }, '*');
});

const stationMenu = get('station-menu');
const stationTitle = get('station-title');
const stationDescription = get('station-description');
const stationStatus = get('station-status');
const stationOptions = get('station-options');
const stationResearch = get('station-research');
const stationStudies = get('station-studies');
const stationPassage = get('station-passage');
const antiqueUpgrades = era.number === 1;
let openStation;
let stationTrigger;
let studyMenuState;
let optionsMenuState;
let parts = 0;
let upgrades = {};
let autoWheelAt = 0;
let autoDiceAt = 0;

const upgradeGroups = {
  wheel: [
    {id:'speed', name:'Axe poli', cost:1, effect:'La rotation passe de 0,48 s à 0,26 s.'},
    {id:'force', name:'Levier de pierre', cost:1, effect:'Deux crans par pression pour le même coût en endurance.'},
    {id:'autoWheel', name:'Contrepoids', cost:2, effect:'Une pression toutes les 5 s, selon l’endurance disponible.', study:true},
  ],
  dice: [
    {id:'luck', name:'Seconde chance', cost:1, effect:'15 % de chance d’obtenir un second tirage. La meilleure figure compte.'},
    {id:'reward', name:'Offrande', cost:1, effect:'Les combinaisons prolongent la protection d’endurance de 5 s.'},
    {id:'autoDice', name:'Coupe à bascule', cost:2, effect:'Un lancer automatique dès que les dés sont rechargés.', study:true},
  ],
};

const upgradeRows = new Map();
if (antiqueUpgrades) {
  for (const upgrade of Object.values(upgradeGroups).flat()) {
    const row = document.createElement('div');
    row.className = 'station-option';
    const copy = document.createElement('div');
    const name = document.createElement('h3');
    name.textContent = upgrade.name;
    const effect = document.createElement('p');
    effect.textContent = upgrade.effect + (upgrade.study ? ' Une étude terminée requise.' : '');
    copy.append(name, effect);
    const button = document.createElement('button');
    button.type = 'button';
    button.addEventListener('click', () => {
      if (upgrades[upgrade.id] || campaignFinished || passageRequested || parts < upgrade.cost || (upgrade.study && !knowledgeLevel)) return;
      parts -= upgrade.cost;
      upgrades[upgrade.id] = true;
      if (upgrade.id === 'speed') wheelimage.style.setProperty('--wheel-duration', '.26s');
      refreshStationMenu();
    });
    row.append(copy, button);
    upgradeRows.set(upgrade.id, {row, button});
  }
}

function resetStationProgress() {
  parts = 0;
  upgrades = {};
  autoWheelAt = 0;
  autoDiceAt = 0;
  wheelimage.style.setProperty('--wheel-duration', '.48s');
  if (stationMenu.open) stationMenu.close();
}

function renderStudyMenu() {
  const now = performance.now();
  const studying = studyEndAt > now;
  const state = `${phase}:${knowledgeLevel}:${studying}`;
  if (state === studyMenuState) return;
  studyMenuState = state;
  stationStudies.replaceChildren();
  knowledgeStages.forEach(({label, text}, index) => {
    const item = document.createElement('li');
    const name = document.createElement('strong');
    const done = index < knowledgeLevel;
    const current = index === knowledgeLevel;
    item.dataset.state = done ? 'done' : 'pending';
    name.textContent = label;
    const detail = done ? text : current && studying ? 'Étude en cours.' : current && phase >= 1 ? 'À étudier.' : 'À débloquer.';
    item.append(name, ' · ' + detail);
    stationStudies.append(item);
  });
}

function refreshStationMenu() {
  if (!openStation) return;
  if (openStation === 'study') {
    renderStudyMenu();
    if (stationStatus.textContent !== studyHint.textContent) stationStatus.textContent = studyHint.textContent;
    return;
  }
  if (openStation === 'window') {
    const text = campaign ? objectiveStatus.textContent || 'Les objectifs de l’ère sont dans le panneau à droite.' : '';
    if (stationStatus.textContent !== text) stationStatus.textContent = text;
    stationStatus.hidden = !campaign;
    stationPassage.hidden = !campaign || objectiveAction.disabled;
    if (stationPassage.textContent !== objectiveAction.textContent) stationPassage.textContent = objectiveAction.textContent;
    return;
  }
  const status = [];
  if (antiqueUpgrades) status.push(parts + ' pièce' + (parts === 1 ? '' : 's') + ' d’atelier · 1 par tour complet');
  if (openStation === 'dice') {
    if (phase < 1) status.push('Le premier tour débloque les lancers.');
    else if (rollTimer !== null) status.push('Lancer en cours.');
    else if (readyAt > 0) status.push('Recharge · ' + Math.ceil((readyAt - performance.now()) / 1000) + ' s');
    else status.push('Dés disponibles.');
  }
  const text = status.join(' — ');
  if (stationStatus.textContent !== text) stationStatus.textContent = text;
  stationStatus.hidden = !text;
  if (!antiqueUpgrades) return;
  const state = [openStation, parts, knowledgeLevel, campaignFinished, passageRequested, ...Object.keys(upgrades)].join(':');
  if (state === optionsMenuState) return;
  optionsMenuState = state;
  for (const upgrade of upgradeGroups[openStation]) {
    const {button} = upgradeRows.get(upgrade.id);
    const bought = Boolean(upgrades[upgrade.id]);
    button.textContent = bought ? 'Acquise' : 'Acheter · ' + upgrade.cost;
    button.disabled = bought || campaignFinished || passageRequested || parts < upgrade.cost || (upgrade.study && !knowledgeLevel);
    button.setAttribute('aria-label', bought ? upgrade.name + ' acquise' : 'Acheter ' + upgrade.name + ' pour ' + upgrade.cost + ' pièce(s)');
  }
}

function runStationAutomation(now) {
  if (campaignFinished || passageRequested || document.hidden || stationMenu.open) return;
  if (upgrades.autoDice && now >= autoDiceAt && !diceAction.disabled) {
    autoDiceAt = now + diceCooldownMs;
    diceRoll();
  }
  if (upgrades.autoWheel && now >= autoWheelAt) {
    autoWheelAt = now + 5000;
    const canPay = phase === 0 || now < staminaProtectedUntil || stamina >= WHEEL_COST;
    if (canPay) stepWheel();
  }
}

stationPassage.addEventListener('click', () => {
  if (objectiveAction.disabled) return;
  stationMenu.close();
  objectiveAction.click();
});
stationMenu.addEventListener('close', () => {
  if (stationMenu.open) return;
  openStation = undefined;
  stationTrigger?.focus();
});
for (const [key, id] of Object.entries({wheel:'wheel-menu-zone', dice:'dice-menu-zone', study:'study-menu-zone', window:'window-menu-zone'})) {
  const zone = get(id);
  zone.addEventListener('click', () => {
    if (stationMenu.open) return;
    openStation = key;
    stationTrigger = zone;
    studyMenuState = undefined;
    optionsMenuState = undefined;
    const labels = {
      wheel: ['Roue', antiqueUpgrades ? 'Améliore la vitesse, la poussée ou l’entraînement de la roue.' : 'Vitesse, poussée et automatisation de la roue. Améliorations à définir pour cette ère.'],
      dice: ['Yahtzee · Chance', antiqueUpgrades ? 'Améliore les chances, la protection d’endurance ou le rythme des lancers.' : 'Chance, gains et automatisation des lancers. Améliorations à définir pour cette ère.'],
      study: ['Étude · ' + era.studyName, lore.inspectBook],
      window: ['Fenêtre', era.windowDescription + '.'],
    };
    [stationTitle.textContent, stationDescription.textContent] = labels[key];
    const rows = antiqueUpgrades ? (upgradeGroups[key] ?? []).map(({id}) => upgradeRows.get(id).row) : [];
    stationOptions.replaceChildren(...rows);
    stationOptions.hidden = rows.length === 0;
    stationResearch.hidden = key !== 'study';
    stationPassage.hidden = true;
    stationStatus.hidden = rows.length === 0 && key !== 'study';
    refreshStationMenu();
    stationMenu.showModal();
  });
}

function restart(){
 steps=0;clicks=0;phase=0;times=[];completedRolls=0;
 campaignFinished=false;passageRequested=false;
 resetResources();
 resetStationProgress();
 if(arrivalCharacter){
  ({level,currentExp,vitality,intelligence,availableAttributePoints,availableTalentPoints,mana,manaUnlocked}=arrivalCharacter);
  arrivalCharacter=null;
  renderResources();
 }
 resetDice();
 total.textContent='0';cps.textContent='0,0';
 journal.replaceChildren();
 wheelRender(true);
 refresh();
 log(lore.start);
 updateObjectives();
}
prev.addEventListener('click',()=>gotoPhase(phase-1,'cheat'));next.addEventListener('click',()=>gotoPhase(phase+1,'cheat'));reset.addEventListener('click',restart);

const wheelAction = get('antique-wheel-action');
const studyAction = get('antique-study-action');
const assembly = get('book-assembly');
wheelAction.addEventListener('click', stepWheel);
studyAction.addEventListener('click', startStudy);
diceAction.addEventListener('click', diceRoll);

function updateSceneActions() {
  const now = performance.now();
  const studying = studyEndAt > now;
  const recovering = studyReadyAt > now;
  wheelAction.hidden = false;
  wheelAction.disabled = campaignFinished || passageRequested;
  studyAction.hidden = phase < 1;
  diceAction.hidden = phase < 1;
  studyAction.disabled = campaignFinished || passageRequested || phase < 1 || studying || recovering || knowledgeLevel >= knowledgeStages.length;
  studyAction.title = studying ? 'Étude en cours' : recovering ? 'Étude en recharge' : `Étudier (${STUDY_COST} END)`;
  assembly.classList.toggle('study-active', studying);
}

setInterval(()=>{
 rate();cooldown();updateResources();completeStudy();renderStudy();updateSceneActions();
 runStationAutomation(performance.now());
 refreshStationMenu();
},100);
const examples = [
  ['Paire', [2, 6, 4, 2, 1]],
  ['Double paire', [4, 2, 6, 4, 2]],
  ['Brelan', [4, 2, 4, 5, 4]],
  ['Carré', [5, 5, 3, 5, 5]],
  ['Full', [3, 2, 3, 2, 2]],
  ['Petite suite', [5, 3, 2, 4, 2]],
  ['Grande suite', [5, 2, 4, 1, 3]],
  ['Yahtzee', [6, 6, 6, 6, 6]],
  ['Aucune combinaison', [1, 2, 3, 5, 6]]
];

function setupEssai() {
  if (reviewMode === 'partie' || campaign) return;

  const descriptions = {
    roue: ['Roue', 'Observe le disque, son axe et le bâti au fil des crans.'],
    papyrus: [era.studyName, 'Le test commence avec 10 points d’endurance.'],
    des: ['Décor complet', 'Essaie la roue, l’étude ou le Yahtzee.'],
    decor: ['Décor', 'La pièce éclairée, avec la roue au repos.'],
    interface: ['Interface', 'Change d’état de test pour voir les panneaux et les commandes qui apparaissent.']
  };
  const [title, description] = descriptions[reviewMode];
  const commands = get('essai-commandes');
  const status = get('essai-etat');
  get('essai-titre').textContent = title;
  get('essai-description').textContent = description;

  function action(label, handler) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.addEventListener('click', handler);
    commands.append(button);
    return button;
  }

  function watch(read, update) {
    let previous;
    const refreshStatus = () => {
      const next = read();
      if (next === previous) return;
      previous = next;
      status.textContent = next;
      update?.();
    };
    refreshStatus();
    setInterval(refreshStatus, 100);
  }

  switch (reviewMode) {
    case 'roue':
      action('Tourner la roue', () => wheelAction.click());
      action('Revenir au départ', () => {
        restart();
      });
      status.setAttribute('aria-live', 'polite');
      watch(() => `${steps} ${steps === 1 ? 'cran' : 'crans'} · ${steps * 36 % 360}° depuis le départ`);
      break;

    case 'papyrus': {
      gotoPhase(1, 'essai');
      stamina = maxStamina;
      renderResources();
      const study = action(era.studyAction, () => studyAction.click());
      watch(() => {
        const discovery = knowledgeStages[knowledgeLevel - 1];
        const note = discovery ? ` · ${discovery.label}. ${discovery.text}` : '';
        return `${studyHint.textContent} · Endurance ${fmt1(stamina)} / ${maxStamina}${note}`;
      }, () => {
        study.disabled = studyEndAt > performance.now() || studyReadyAt > performance.now() || knowledgeLevel >= knowledgeStages.length;
      });
      break;
    }

    case 'des': {
      gotoPhase(1, 'essai');
      stamina = maxStamina;
      renderResources();
      status.hidden = true;
      const [hand, faces] = examples[0];
      showDice(faces, hand);
      const roll = action('Lancer les cinq dés', diceRoll);
      const picker = document.createElement('select');
      picker.setAttribute('aria-label', 'Essayer une figure');
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.disabled = true;
      placeholder.textContent = 'Essayer une figure';
      picker.append(placeholder);
      examples.forEach(([name], index) => {
        const option = document.createElement('option');
        option.value = String(index);
        option.textContent = name;
        picker.append(option);
      });
      picker.value = '';
      picker.addEventListener('change', () => {
        if (picker.value === '' || rollTimer !== null) return;
        const [name, values] = examples[Number(picker.value)];
        showDice(values, name);
        picker.value = '';
      });
      commands.append(picker);
      watch(() => `${readyAt}:${rollTimer !== null}`, () => {
        roll.disabled = readyAt > performance.now();
        picker.disabled = rollTimer !== null;
      });
      break;
    }

    case 'decor':
      status.hidden = true;
      break;

    case 'interface': {
      function showPhase(target) {
        if (target === 0) restart();
        else gotoPhase(target, 'essai');
        phaseButtons.forEach((button, index) => button.setAttribute('aria-pressed', String(target === index)));
        effect.disabled = target === 0;
      }
      const phaseButtons = testStates.map((label, index) => action(label, () => showPhase(index)));
      const effect = action('Voir un effet temporaire', () => protectStamina('Brelan'));
      showPhase(0);
      status.hidden = true;
      break;
    }
  }
}

restart();
objectives.hidden = !campaign;
get('stamina-regen').textContent = '+' + fmt1(STAMINA_REGEN) + ' / sec';
setupEssai();
})();
</script>

.study-hint{display:none!important;position:absolute!important;left:50%!important;top:calc(100% + 2px)!important;transform:translateX(-50%)!important;background:#201713e8;border:1px solid #aa804e;border-radius:14px;font-size:10px;white-space:nowrap;padding:5px 8px;pointer-events:none}
/* Dice display in the drawn bowl; five bone dice remain the existing Yahtzee logic. */
.scene-art > .stone-compartment{display:block!important;position:absolute!important;left:38.4%!important;top:72.1%!important;width:17.2%!important;height:11%!important;visibility:hidden;opacity:0;z-index:17;pointer-events:none;transform:translateY(7px);transition:opacity .4s ease,transform .4s ease}
.room.has-dice .scene-art > .stone-compartment{visibility:visible;opacity:1;transform:translateY(0);pointer-events:auto}
.scene-art > .stone-compartment .stone-niche,.scene-art > .stone-compartment .stone-shutter{display:none!important}
.scene-art > .stone-compartment .dice-dock{position:relative!important;inset:auto!important;display:flex!important;opacity:1!important;transform:none!important;pointer-events:auto!important;gap:2px!important}
.scene-art > .stone-compartment .dice-rail{background:linear-gradient(180deg,#3c2412ed,#1b120cc9)!important;border:1px solid #b58745!important;border-radius:999px!important;min-height:38px!important;padding:3px 4px!important;gap:2px!important;box-shadow:0 6px 13px #0009!important;overflow:visible!important}
.scene-art > .stone-compartment .die{width:23px!important;height:23px!important;box-shadow:0 1px 5px #0009!important}
.scene-art > .stone-compartment .cool{position:absolute;top:-18px;left:50%;transform:translateX(-50%);background:#21160ccc;border-radius:8px;padding:3px 6px;white-space:nowrap;z-index:6}
.scene-art > .stone-compartment.rolling .dice-rail{animation:antique-bowl-shake .46s ease-in-out}
@keyframes antique-bowl-shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}65%{transform:rotate(3deg)}}
.antique-era-label{position:absolute;top:2%;left:50%;transform:translateX(-50%);background:#130d08bc;border:1px solid #c7a064a6;box-shadow:0 2px 9px #000a;color:#ffe6ad;border-radius:18px;padding:5px 15px;z-index:12;font-size:12px;letter-spacing:.25em;font-weight:700;text-shadow:0 1px 2px #0009}
@media(max-width:850px){.scene-art{width:min(100%,1000px)!important}.antique-era-label{font-size:10px;padding:3px 8px}.scene-art > .stone-compartment .die{width:18px!important;height:18px!important}}


.essai { display: none; }
html:not([data-essai="partie"], [data-essai="campagne"]) { color-scheme: dark; background: #12100e; }

html:not([data-essai="partie"]) .dev { display: none; }

.essai[hidden] { display: none !important; }
.essai { max-width: 66rem; margin: 0 auto; padding: 1rem 1rem .75rem; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .6rem 1rem; }
.essai h2 { margin: 0; font: 1.35rem Georgia, serif; }
.essai p { margin: .3rem 0 0; color: #d8c6ad; font-size: .875rem; line-height: 1.45; }
.essai-commandes { display: flex; flex-wrap: wrap; gap: .4rem; }
.essai-commandes :is(button, select) { font-size: .875rem; color: #fff0d3; background: #47321f; border: 1px solid #a37a4b; border-radius: .35rem; padding: .45rem .7rem; cursor: pointer; }
.essai-commandes button:not(:disabled):hover { background: #644929; }
.essai-commandes :is(button, select):focus-visible { outline: 2px solid #ffe2a1; outline-offset: 2px; }
.essai-commandes :is(button, select):disabled { opacity: .52; cursor: default; }
.essai-commandes button[aria-pressed="true"] { background: #eed3a3; color: #21160c; }
.essai-etat { display: block; max-width: 66rem; margin: .65rem auto 0; padding: 0 1rem .8rem; color: #e7c991; font-size: .9rem; font-variant-numeric: tabular-nums; line-height: 1.45; }

.scene-art { width: min(100%, 1280px) !important; max-height: none !important; aspect-ratio: var(--scene-ratio) !important; mask-image: none; }
.a1-scene-image { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.scene-copy, .dice-action-texture img { position: absolute; display: block; max-width: none; object-fit: fill; pointer-events: none; }
.wheel-mask, .wheel-fixed { position: absolute; inset: 0; pointer-events: none; visibility: hidden; }
.wheel-mask { z-index: 3; clip-path: ellipse(49.5% 49.6% at 50% 50%); }
.wheel-fixed { z-index: 5; }
.wheel-fixed .scene-copy { object-fit: fill; }
.artifact.has-turned :is(.wheel-mask, .wheel-fixed) { visibility: visible; }
.artifact .wheel-mask img.wheelimage {
  inset: -3.36% auto auto -4.62% !important;
  width: 109.34% !important;
  height: 107.76% !important;
  object-fit: fill !important;
  filter: none;
  transform-origin: 50% 49.44% !important;
}
.window-view { position: absolute; z-index: 7; visibility: hidden; pointer-events: none; }
.room.lit .window-view { visibility: visible; pointer-events: auto; }
.window-view:focus-visible { outline: 1px solid #ffe0a9; outline-offset: 3px; border-radius: 40% 40% 8% 8%; }
.window-era { position: absolute; bottom: .5rem; left: 50%; transform: translateX(-50%); visibility: hidden; padding: .24rem .64rem; border-radius: .25rem; background: #1c140ee8; border: 1px solid #ae8657; color: #fff0d3; font: .82rem Georgia, serif; white-space: nowrap; pointer-events: none; }
.room.lit .window-view:is(:hover, :focus-visible) .window-era { visibility: visible; }

.scene-hit {
  box-shadow: none;
  border-radius: 0;
  transition: background-color .15s ease;
  touch-action: manipulation;
}
.scene-hit:hover:not(:disabled), .scene-hit:focus-visible {
  outline: none;
  box-shadow: none;
  background: #ffd58b42;
}
.scene-hit:focus-visible { background: #ffe09f75; }
.scene-hit:active:not(:disabled) { transform: none; background: #ffe09f59; }
@media (forced-colors: active) {
  .scene-hit:focus-visible { forced-color-adjust: none; background: #ffffffb8; }
}

.yahtzee-controls { position: absolute; z-index: 16; container-type: inline-size; }
#antique-dice-action { position: relative; z-index: 2; display: block; inset: auto; width: 100%; height: 100%; clip-path: polygon(var(--plate-outline)); }
#antique-dice-action::before {
  content: ''; position: absolute; z-index: 1; inset: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(to right, #ffe1a820, #ffd58a31 96%, #fff1c86b);
  transform: scaleX(var(--recharge, 0)); transform-origin: left center;
}
#antique-dice-action.cooling::before { opacity: 1; transition: transform .1s linear; }
#antique-dice-action::after { content: ''; position: absolute; z-index: 3; inset: 0; pointer-events: none; transition: background-color .15s ease; }
#antique-dice-action:is(:hover, :focus-visible):not(:disabled)::after { background: #ffe09f54; }
.dice-action-lettering { display: none; position: absolute; z-index: 2; inset: 0; pointer-events: none; }
.dice-action-texture {
  position: absolute; inset: 17% 12% 15% 33.5%; overflow: hidden;
  mask-image: linear-gradient(to right, transparent, black 10% 88%, transparent), linear-gradient(to bottom, transparent, black 12% 88%, transparent);
  mask-composite: intersect;
}
.dice-action-label {
  position: absolute; inset: 0 16.5% 0 33.5%; display: grid; place-items: center;
  color: #ffe4b4; font: 400 7.2cqw/1 Georgia, serif; white-space: nowrap; text-shadow: 0 1px 1px #1a1008;
}
#antique-dice-action:not([hidden]):not(:disabled) .dice-action-lettering { display: block; }
.yahtzee-halo { position: absolute; z-index: 1; inset: 0; pointer-events: none; opacity: 0; filter: drop-shadow(0 0 3px #eeb46d) drop-shadow(0 0 5px #d3964480); transition: opacity .18s ease; }
.yahtzee-halo::before { content: ''; position: absolute; inset: 0; clip-path: polygon(evenodd, var(--plate-halo)); background: #efbf7a; }
#antique-dice-action:not([hidden]):not(:disabled) + .yahtzee-halo { opacity: .72; }
.yahtzee-result { position: absolute; left: 0; top: calc(100% + var(--result-gap)); width: 100%; height: 100%; padding: 2.4cqw 4cqw; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4cqw; border: 1px solid #997047; border-radius: 4.5cqw; background: #21170fef; box-shadow: 0 2px 9px #0008, inset 0 0 0 1px #d9af7733; }
.yahtzee-result[hidden] { display: none; }
.result-dice { display: flex; align-items: center; gap: 4cqw; }
.game[data-era="antique"] {
  --die-face: radial-gradient(ellipse at 70% 80%, #a176494f, transparent 58%), linear-gradient(145deg, #fff1d4, #dcc095 79%, #b78d61);
  --die-pips: #4b392a;
  --die-edge: #ae885e;
}
.result-dice .die { width: 10.5cqw; height: 10.5cqw; background: var(--die-face); color: var(--die-pips); border-color: var(--die-edge); border-radius: 1.5cqw; opacity: .62; }
.result-dice .die[data-group="1"] { opacity: 1; outline: 1px solid #ffca76; box-shadow: 0 0 5px #eaa45580; }
.result-dice .die[data-group="2"] { opacity: 1; outline: 1px solid #f3a480; box-shadow: 0 0 5px #d4714980; }
.result-dice .die[data-group="1"] + .die[data-group="1"]::before,
.result-dice .die[data-group="2"] + .die[data-group="2"]::before { content: ''; position: absolute; right: 100%; top: 50%; width: calc(4cqw + 2px); height: 1px; background: #ffca76; }
.result-dice .die[data-group="2"] + .die[data-group="2"]::before { background: #f3a480; }
.result-label { color: #ffe3ad; font: 700 clamp(7px, 7.4cqw, 14px)/1 Georgia, serif; white-space: nowrap; }
.yahtzee-result.rolling .die { opacity: 1; animation: result-tumble .14s ease-in-out infinite alternate; }
@keyframes result-tumble { from { transform: rotate(-10deg); } to { transform: rotate(8deg); } }
.yahtzee-result[data-celebration] { --spark-strength: #dcb26ba6; --spark-duration: .95s; animation: result-halo var(--spark-duration) ease-out; }
.yahtzee-result[data-celebration="yahtzee"] { --spark-strength: #ffdc9de0; --spark-duration: 1.45s; }
.yahtzee-result[data-celebration]::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(110deg, transparent 36%, #fff4cb40 50%, transparent 64%) -140% 0 / 60% 100% no-repeat;
  animation: result-shine var(--spark-duration) ease-out;
}
@keyframes result-halo {
  0%, 100% { box-shadow: 0 2px 9px #0008, inset 0 0 0 1px #d9af7733; }
  24% { box-shadow: 0 0 13px var(--spark-strength), inset 0 0 0 1px var(--spark-strength); }
}
@keyframes result-shine { to { background-position: 240% 0; } }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.stage, .room { min-height: clamp(300px, 56vh, 520px); }
.game-hud { display: none; }
.game.has-rpg .game-hud {

.orb-actions .orb-glass { background-color: #111c28; }

.objectives p { margin: 0 0 .75rem; color: #e9d8bc; font-size: .84rem; line-height: 1.45; }
.objectives p:empty { display: none; }
.objectives button { width: 100%; padding: .52rem .65rem; border: 1px solid #a37a4b; border-radius: .35rem; background: #47321f; color: #fff0d3; font: inherit; cursor: pointer; }
.objectives button:hover:not(:disabled) { background: #644929; }
.objectives button:focus-visible { outline: 2px solid #ffe0a9; outline-offset: 2px; }
.objectives button:disabled { opacity: .52; cursor: default; }
[data-essai="campagne"] .room.lit .scene-art { transition: none; }
@media (min-width: 881px) {
  [data-essai="campagne"] .game { height: 100vh; }
  [data-essai="campagne"] .journal-panel { min-height: 0; }
  [data-essai="campagne"] .knowledge-body { overflow-y: auto; }

.study-motion {
  position: absolute; inset: var(--study-inset, 12% 6% 8%); z-index: 1; pointer-events: none;
  border-radius: var(--study-radius, 18%); overflow: hidden;
  opacity: 0; transition: opacity .22s ease;
}
.study-motion::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse, var(--study-light, #ffda8178), transparent 81%);
}
.study-motion::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(var(--study-angle, 106deg), transparent 34%, var(--study-glint, #fff2bca6) 50%, transparent 66%);
  mask-image: radial-gradient(ellipse, #000 42%, transparent 80%);
  background-size: 250% 250%; background-repeat: no-repeat;
}
.study-active .study-motion { opacity: 1; }
.study-active .study-motion::before { animation: study-light 2.6s ease-in-out infinite; }
.study-active .study-motion::after { animation: study-sweep 2.6s ease-in-out infinite; }
@keyframes study-light { 0%, 100% { opacity: .46; } 50% { opacity: 1; } }
@keyframes study-sweep {
  0% { opacity: 0; background-position: 140% 140%; }
  28%, 56% { opacity: .95; }
  80%, 100% { opacity: 0; background-position: -40% -40%; }
}
.game[data-era="medieval"] { --study-light: #a39cff8a; --study-glint: #91f9ffb5; --study-inset: 5% 16% 10% 10%; }
.game[data-era="industrial"] { --study-light: #f7c98371; --study-glint: #ffd696b5; --study-inset: 4% 8% 11%; }
.game[data-era="ai"] { --study-light: #58eec08e; --study-glint: #9affdcb5; --study-inset: 4% 4% 33%; --study-angle: 0deg; --study-radius: 4%; }
.game[data-era="future"] { --study-light: #ec9c5888; --study-glint: #e1b3ffb5; --study-inset: 5%; --study-radius: 50%; }

@media (max-width: 520px) { .game-hud .xp-label > span:last-child { display: none; } }

html:is([data-essai="roue"], [data-essai="papyrus"], [data-essai="des"], [data-essai="decor"]) :is(.rpg-panel, .journal-panel, .game-hud, .effects-band),
html:is([data-essai="roue"], [data-essai="papyrus"], [data-essai="des"], [data-essai="decor"]) .room::after { display: none !important; }
html:is([data-essai="roue"], [data-essai="papyrus"], [data-essai="des"], [data-essai="decor"]) .room.lit .scene-art { opacity: 1; filter: none !important; transition: none; }

<script>
(()=>{
const reviewMode = document.documentElement.dataset.essai;
const campaign = reviewMode === 'campagne';
const era = {"number":5,"label":"Futuriste","studyName":"Sphère","sceneDescription":"Avant-poste orbital. Roue en matériau irisé à gauche, baie centrale et sphère contenant un trou noir à droite.","windowDescription":"Colonie orbitale, serres et navettes au-dessus d’une planète habitée","studyAction":"Étudier la sphère","knowledgeTitle":"Observations orbitales","reserveName":"Matière","progression":{"goals":[3,3,3],"complete":"Depuis l’avant-poste, vous transmettez les relevés de la sphère à la colonie. La dernière observation rejoint celles du papyrus."},"lore":{"start":"L’avant-poste surplombe la colonie orbitale. Près de la baie, la sphère de confinement laisse voir un anneau lumineux.","dice":"Le premier tour active le projecteur sous la baie. Cinq dés de lumière peuvent être lancés dans son anneau gravitationnel.","inspectBook":"La lumière autour du trou noir forme un arc visible au-dessus de son disque.","startStudy":"Vous relevez les variations de l’anneau lumineux à travers la sphère.","awakenReserve":"Les instruments de la salle consignent une première réserve de matière."},"bookTooltip":"Examiner la sphère de confinement","knowledge":[{"label":"Observation","text":"L’anneau lumineux de la sphère reste visible lorsque les lampes de service s’atténuent."},{"label":"Hypothèse","text":"La courbure de la lumière pourrait expliquer le second arc au-dessus du disque."},{"label":"Compréhension","text":"Les relevés confirment que les deux arcs proviennent de la même source lumineuse autour du trou noir."}]};
const {lore, knowledge: knowledgeStages} = era;
const get=id=>document.getElementById(id);
const sceneImage = get('a1-scene-image');
for (const copy of document.querySelectorAll('[data-scene-copy]')) copy.src = sceneImage.src;
const game=get('game'),stage=get('stage'),room=get('room'),art=get('artifact'),wheelimage=get('wheelimage');
const eraSelect = get('prototype-era');
eraSelect.addEventListener('change', () => {
  const nextEra = eraSelect.value;
  eraSelect.value = game.dataset.era;
  parent.postMessage({type: 'prototype-era', era: nextEra}, '*');
});
const devState=get('dev-state'),prev=get('prev'),next=get('next'),reset=get('reset'),wheelcount=get('wheel-count');
const testStates = ['Premier tour', 'Étude débloquée', 'Informations'];
const journal=get('journal'),fc=get('filter-click'),fd=get('filter-dice'),total=get('total'),cps=get('cps');
const diceAction=get('antique-dice-action'),diceResult=get('dice-result'),diceSummary=get('dice-summary'),diceAnnouncement=get('dice-announcement');
const dice=Array.from(get('dice-rail').querySelectorAll('.die'));
const digitalScreen = get('digital-screen');
const digitalDice = Array.from(digitalScreen?.querySelectorAll('.die') ?? []);
const orbitalProjector = get('orbital-projector');
const orbitalDice = Array.from(orbitalProjector?.querySelectorAll('.die') ?? []);
const actionsValue=get('actions-value'),actionsLiquid=get('actions-liquid'),actionsCard=get('actions-card');
const attributesToggle=get('attributes-toggle'),attributesBody=get('attributes-body'),attributesChevron=get('attributes-chevron');
const staminaValue=get('stamina-value'),staminaFill=get('stamina-fill'),vitalityValue=get('vitality-value'),vitalityLiquid=get('vitality-liquid'),manaCard=get('mana-card'),manaValue=get('mana-value'),manaCaption=get('mana-caption');
const xpLevel=get('xp-level'),xpValues=get('xp-values'),xpRequired=get('xp-required'),xpFill=get('xp-fill');
const devStamina=get('dev-stamina'),devLevel=get('dev-level');
const attributePointsEl=get('attribute-points'),talentPointsEl=get('talent-points'),staminaCost=get('stamina-cost');
const effectsBand=get('effects-band'),effectEndurance=get('effect-endurance'),effectTime=get('effect-time');
const studyHint=get('study-hint'),rightPanel=get('right-panel'),knowledgeToggle=get('knowledge-toggle'),journalTitle=get('journal-title'),knowledgeNotes=get('knowledge-notes');
const intelligenceRow=get('intelligence-row'),intelligenceValue=get('intelligence-value'),allocateIntelligence=get('allocate-intelligence');
const pipMap={1:[[50,50]],2:[[26,26],[74,74]],3:[[26,26],[50,50],[74,74]],4:[[26,26],[74,26],[26,74],[74,74]],5:[[26,26],[74,26],[50,50],[26,74],[74,74]],6:[[26,24],[74,24],[26,50],[74,50],[26,76],[74,76]]};
function setFace(d,v){d.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true">'+pipMap[v].map(([x,y])=>'<circle cx="'+x+'" cy="'+y+'" r="11" fill="currentColor"/>').join('')+'</svg>';d.setAttribute('aria-label','Dé : '+v);}
const WHEEL_COST = campaign ? 1 : 5;
const STAMINA_REGEN = campaign ? 0.5 : 0.1;
let phase=0,steps=0,clicks=0,times=[],readyAt=0,rollTimer=null;
let resourcesUnlocked=false,stamina=1,maxStamina=10,vitality=2,maxVitality=10,mana=0,maxMana=10,manaUnlocked=false,level=0,currentExp=0,lastResourceTime=performance.now(),lastFatigueNotice=performance.now()-2000;
let availableAttributePoints=0,availableTalentPoints=0,staminaProtectedUntil=0;
// V0.9: paramètres d'équilibrage PROVISOIRES, distincts des décisions de Pierre.
const STUDY_COST=3,STUDY_DURATION=12_000,STUDY_COOLDOWN=20_000;
let intelligence=0,knowledgeLevel=0,studyEndAt=0,studyReadyAt=0,knowledgeMode=false;
// Huit catégories, dans l'ordre croissant décidé pour les 5 secondes par rang.
const ranks={"Paire":1,"Double paire":2,"Brelan":3,"Carré":4,"Full":5,"Petite suite":6,"Grande suite":7,"Yahtzee":8};
function targetExp(lvl){return [100,200,600][lvl]??null;} // Paliers ultérieurs non définis
function fmt1(v){return Math.max(0,v).toFixed(1).replace('.',',');}
function renderResources(){
 staminaValue.textContent=fmt1(stamina)+' / '+maxStamina;
 staminaFill.style.width=Math.min(100,100*stamina/maxStamina)+'%';
 vitalityValue.textContent=fmt1(vitality)+' / '+maxVitality;
 vitalityLiquid.style.height=Math.min(100,100*vitality/maxVitality)+'%';
 manaCard.hidden=!manaUnlocked;
 manaValue.textContent=fmt1(mana)+' / '+maxMana;
 manaCaption.textContent=manaUnlocked?'Réserve pour les futures techniques liées à l’intelligence.':'S’éveillera avec l’intelligence.';
 actionsValue.textContent=staminaValue.textContent;
 actionsLiquid.style.height=staminaFill.style.width;
 actionsCard.setAttribute('aria-label','Endurance : '+fmt1(stamina)+' sur '+maxStamina);
 const goal=targetExp(level);
 xpLevel.textContent='Niveau '+level;
 xpValues.textContent=goal===null?currentExp.toLocaleString('fr-BE')+' EXP en attente':currentExp.toLocaleString('fr-BE')+' / '+goal.toLocaleString('fr-BE')+' EXP';
 xpRequired.textContent=goal===null?'Palier suivant : à définir':'Palier : '+goal.toLocaleString('fr-BE')+' EXP';
 xpFill.style.width=goal===null?'0%':Math.min(100,100*currentExp/goal)+'%';
 devLevel.disabled=phase<1||goal===null;
 attributePointsEl.textContent=availableAttributePoints.toLocaleString('fr-BE');
 talentPointsEl.textContent=availableTalentPoints.toLocaleString('fr-BE');
 const remaining=Math.max(0,(staminaProtectedUntil-performance.now())/1000);
 staminaCost.textContent=(phase===0||remaining>0?0:WHEEL_COST)+' / cran';
 renderEffects(remaining);
 intelligenceRow.hidden=availableAttributePoints===0&&intelligence===0;
 intelligenceValue.textContent=String(intelligence);
 allocateIntelligence.disabled=campaignFinished||passageRequested||phase<1||availableAttributePoints<1;
}
function unlockResources(){
 if(resourcesUnlocked)return;
 resourcesUnlocked=true;
 lastResourceTime=performance.now();
 renderResources();
}
function updateResources(){
 const now=performance.now();
 const elapsed=Math.max(0,Math.min(60,(now-lastResourceTime)/1000));
 lastResourceTime=now;
 if(!campaignFinished&&!passageRequested&&phase>=1&&resourcesUnlocked){stamina=Math.min(maxStamina,stamina+STAMINA_REGEN*elapsed);renderResources();}
}
function awardExp(amount,source){
 if(!resourcesUnlocked||amount<=0)return;
 currentExp+=amount;
 const goal=targetExp(level);
 if(goal!==null&&currentExp>=goal){
   level++;currentExp=0; // Retour à zéro sur les seuils connus. Le surplus des futurs gains reste à spécifier.
   availableAttributePoints+=5;
   availableTalentPoints+=2;
   log('Niveau '+level+' atteint ! +5 points d’attributs, +2 points de talents ('+source+')','system',true);
 }
 renderResources();
}
function resetResources(){
 resourcesUnlocked=false;stamina=campaign?10:1;maxStamina=10;vitality=2;maxVitality=10;mana=0;maxMana=10;manaUnlocked=false;
 level=0;currentExp=0;availableAttributePoints=0;availableTalentPoints=0;staminaProtectedUntil=0;lastResourceTime=performance.now();lastFatigueNotice=performance.now()-2000;
 intelligence=0;knowledgeLevel=0;studyEndAt=0;studyReadyAt=0;knowledgeMode=false;
 rightPanel.classList.remove('knowledge-mode');knowledgeNotes.replaceChildren();knowledgeToggle.hidden=true;journalTitle.textContent='Journal';
 attributesBody.hidden=false;attributesToggle.setAttribute('aria-expanded','true');attributesChevron.textContent='▾';
 renderResources();
}
attributesToggle.addEventListener('click',()=>{
 const opened=attributesToggle.getAttribute('aria-expanded')==='true';
 attributesToggle.setAttribute('aria-expanded',String(!opened));attributesBody.hidden=opened;
 attributesChevron.textContent=opened?'▸':'▾';
});
allocateIntelligence.addEventListener('click',()=>{
 if(campaignFinished||passageRequested||phase<1||availableAttributePoints<1)return;
 availableAttributePoints--;intelligence++;
 const firstAwakening=!manaUnlocked;
 if(firstAwakening){manaUnlocked=true;mana=Math.max(mana,1);log(lore.awakenReserve,'system',true);}
 renderResources();renderStudy();log('Intelligence +1 : votre étude gagne en rapidité.','system',true);
});
knowledgeToggle.addEventListener('click',()=>{
 if(knowledgeLevel<1)return;
 knowledgeMode=!knowledgeMode;
 rightPanel.classList.toggle('knowledge-mode',knowledgeMode);
 journalTitle.textContent=knowledgeMode?'Connaissances':'Journal';
 knowledgeToggle.textContent=knowledgeMode?'← Journal':'Connaissances';
});
function renderEffects(remainSeconds){
 const active=remainSeconds>0;
 effectEndurance.hidden=!active;
 effectsBand.classList.toggle('visible',active);
 if(!active)return;
 const display=remainSeconds>60?Math.ceil(remainSeconds/60)+'m':Math.ceil(remainSeconds)+'s';
 effectTime.textContent=display;
 effectEndurance.style.background='conic-gradient(#8db892 '+Math.max(0,100*(remainSeconds/40))+'%, #34453b 0)';
 effectEndurance.setAttribute('aria-label','Protection d’endurance : '+display+' restant');
}
function studyDuration(){return Math.max(5000,STUDY_DURATION-intelligence*1000);}
function renderStudy(){
 const now=performance.now(),active=phase>=1&&studyEndAt>now;
 showObjectiveStudyTime(now);
 studyHint.hidden=phase<1;
 if(phase<1){studyHint.textContent='L’étude se débloque au premier tour de roue.';return;}
 if(knowledgeLevel>=knowledgeStages.length){studyHint.textContent='Études actuelles terminées';return;}
 if(active){studyHint.textContent='Étude : '+Math.ceil((studyEndAt-now)/1000)+' s';return;}
 if(studyReadyAt>now){studyHint.textContent='Reprise : '+Math.ceil((studyReadyAt-now)/1000)+' s';return;}
 studyHint.textContent='Étudier · '+STUDY_COST+' END';
}
function startStudy(){
 if(campaignFinished||passageRequested||phase<1||knowledgeLevel>=knowledgeStages.length)return;
 const now=performance.now();
 if(studyEndAt>now||studyReadyAt>now)return;
 updateResources();
 if(stamina+1e-6<STUDY_COST){log('Endurance insuffisante pour étudier ('+STUDY_COST+' nécessaires).','system');return;}
 stamina-=STUDY_COST;studyEndAt=now+studyDuration();studyReadyAt=now+STUDY_COOLDOWN;
 renderResources();renderStudy();updateSceneActions();log(lore.startStudy,'system');
}
function completeStudy(){
 if(campaignFinished||passageRequested||!studyEndAt||performance.now()<studyEndAt)return;
 studyEndAt=0;
 if(knowledgeLevel>=knowledgeStages.length)return;
 const item=knowledgeStages[knowledgeLevel++];
 const note=document.createElement('div');note.className='knowledge-note';
 const heading=document.createElement('strong');heading.textContent=item.label;
 const content=document.createElement('span');content.textContent=item.text;
 note.append(heading,content);knowledgeNotes.appendChild(note);
 knowledgeToggle.hidden=false;
 log('Étude terminée — '+item.label+' consignée dans les Connaissances.','system',true);
 updateObjectives();
 renderStudy();
}
devStamina.addEventListener('click',()=>{
 if(phase<1)return;updateResources();stamina=Math.min(maxStamina,stamina+5);renderResources();
 log('DEV : +5 endurance (test)','system');
});
devLevel.addEventListener('click',()=>{
 if(phase<1||targetExp(level)===null)return;
 awardExp(targetExp(level)-currentExp,'test DEV');
});
function clock(){return new Date().toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});}
function visible(kind){return kind==='click'?fc.checked:kind==='dice'?fd.checked:true;}
function log(msg,kind='lore',success=false){const el=document.createElement('div');el.className='entry '+kind+(success?' success':'');el.dataset.kind=kind;el.textContent=(kind==='lore'?'':clock()+' ')+msg;el.hidden=!visible(kind);journal.appendChild(el);if(!el.hidden)journal.scrollTop=journal.scrollHeight;}
function applyFilters(){journal.querySelectorAll('.entry').forEach(e=>e.hidden=!visible(e.dataset.kind));journal.scrollTop=journal.scrollHeight;}
fc.addEventListener('change',applyFilters);fd.addEventListener('change',applyFilters);
function wheelRender(instant=false){
  art.classList.toggle('has-turned', steps > 0);
  wheelcount.textContent = 'Roue = ' + Math.floor(steps / 10) + '.' + steps % 10;
  if (instant) wheelimage.classList.add('instant');
  wheelimage.style.transform = `rotate(${steps * 36}deg)`;
  if (instant) {
    void wheelimage.offsetWidth;
    wheelimage.classList.remove('instant');
  }
}
function refresh(){
 const showResources = campaign || phase>=1;
 game.classList.toggle('has-rpg',showResources);
 stage.classList.toggle('has-rpg',showResources);
 stage.classList.toggle('has-info',campaign||phase>=2);
 room.classList.add('lit');
 room.classList.toggle('has-dice',phase>=1);
 devStamina.disabled=phase<1;
 devLevel.disabled=phase<1||targetExp(level)===null;
 devState.textContent=testStates[phase];
 prev.disabled=phase===0;next.disabled=phase===2;
 wheelRender();renderResources();renderStudy();cooldown();updateSceneActions();
}
function gotoPhase(n,why=''){
 const target=Math.min(2,Math.max(0,n));if(target===phase)return;
 if(target===0){
  restart();
  return;
 }
 phase=target;
 steps=Math.max(steps,10);
 wheelRender(true);
 unlockResources();
 refresh();
 if(why==='cheat')log('DEV · '+testStates[phase],'system');
 if(why==='dice')log('Combinaison admissible : informations débloquées.','system',true);
}
function stepWheel(){
 if(campaignFinished||passageRequested)return;
 if(phase>=1){
  updateResources();
  const enduranceCost=performance.now()<staminaProtectedUntil?0:WHEEL_COST;
  if(stamina+1e-6<enduranceCost){
    if(performance.now()-lastFatigueNotice>1800){log('Endurance insuffisante : '+fmt1(stamina)+' / '+enduranceCost+' nécessaires.','system');lastFatigueNotice=performance.now();}
    return;
  }
  stamina=Math.max(0,stamina-enduranceCost);renderResources();
 }
 const previousTours = Math.floor(steps/10);
 steps+=upgrades.force?2:1;clicks++;times.push(performance.now());
 total.textContent=clicks.toLocaleString('fr-BE');wheelRender();rate();
 log('+1 clic ('+clicks+')','click');
 if(Math.floor(steps/10)>previousTours){
   if(antiqueUpgrades) parts++;
   if(reviewMode!=='roue'){
    if(phase===0){phase=1;unlockResources();refresh();log(lore.dice);}
    awardExp(1,'tour de roue');
    updateObjectives();
   }
   refreshStationMenu();
 }
}
function rate(){const t=performance.now();times=times.filter(v=>t-v<1000);cps.textContent=times.length.toFixed(1).replace('.',',');}
function combination(a){
 const c=Array(7).fill(0);a.forEach(x=>c[x]++);
 const counts=c.slice(1);
 const m=Math.max(...counts);
 const unique=[...new Set(a)].sort((x,y)=>x-y);
 const straight=unique.join(',');
 const hasFourConsecutive=unique.some(v=>v<=3&&[v,v+1,v+2,v+3].every(n=>unique.includes(n)));
 const found=[];
 if(m>=2)found.push('Paire');
 if(counts.filter(x=>x===2).length>=2)found.push('Double paire');
 if(m>=3)found.push('Brelan');
 if(m>=4)found.push('Carré');
 if(counts.includes(3)&&counts.includes(2))found.push('Full');
 if(hasFourConsecutive)found.push('Petite suite');
 if(straight==='1,2,3,4,5'||straight==='2,3,4,5,6')found.push('Grande suite');
 if(m===5)found.push('Yahtzee');
 return found.length?found.reduce((a,b)=>ranks[b]>ranks[a]?b:a):'Aucune combinaison';
}
function protectStamina(hand){
 const rank=ranks[hand]||0;
 if(!rank)return;
 const duration=(rank+(upgrades.reward?1:0))*5000;
 // Une réussite rafraîchit la protection sans raccourcir la durée encore active.
 const newDeadline=performance.now()+duration;
 if(newDeadline>=staminaProtectedUntil)staminaProtectedUntil=newDeadline;
 renderResources();
 log('Endurance protégée pendant '+(duration/1000)+' s ('+hand+').','system',true);
}
const diceCooldownMs = 10_000;
// Figures retenues dans moins de 5 % des lancers avec le classement actuel.
const rareFigures = new Set(['Carré', 'Full', 'Grande suite', 'Yahtzee']);

function cooldown() {
  const remaining = Math.max(0, readyAt - performance.now());
  if (!remaining) readyAt = 0;
  const charging = phase >= 1 && remaining > 0;
  diceAction.disabled = campaignFinished || passageRequested || phase < 1 || charging;
  diceAction.classList.toggle('cooling', charging);
  diceAction.style.setProperty('--recharge', charging ? String(1 - remaining / diceCooldownMs) : '0');
}

function arrangedDice(values, hand) {
  const faces = [...new Set(values)].sort((a, b) => a - b);
  const matching = count => faces.filter(face => values.filter(value => value === face).length === count);
  let groups = [];

  switch (hand) {
    case 'Paire': groups = [Array(2).fill(matching(2)[0])]; break;
    case 'Double paire': groups = matching(2).map(face => [face, face]); break;
    case 'Brelan': groups = [Array(3).fill(matching(3)[0])]; break;
    case 'Carré': groups = [Array(4).fill(matching(4)[0])]; break;
    case 'Full': groups = [Array(3).fill(matching(3)[0]), Array(2).fill(matching(2)[0])]; break;
    case 'Yahtzee': groups = [values.slice()]; break;
    case 'Petite suite': {
      const start = faces.find(face => [face + 1, face + 2, face + 3].every(next => faces.includes(next)));
      groups = [[start, start + 1, start + 2, start + 3]];
      break;
    }
    case 'Grande suite': groups = [faces]; break;
  }

  const rest = values.slice();
  const ordered = groups.flatMap((group, index) => group.map(face => {
    rest.splice(rest.indexOf(face), 1);
    return { face, group: index + 1 };
  }));
  return ordered.concat(rest.map(face => ({ face, group: 0 })));
}

function showDice(values, hand) {
  showDigitalDice(values);
  const result = arrangedDice(values, hand);
  showOrbitalDice(result.map(({face}) => face));
  result.forEach(({ face, group }, index) => {
    const die = dice[index];
    setFace(die, face);
    die.dataset.group = String(group);
  });
  diceSummary.textContent = hand;
  diceAnnouncement.textContent = `${hand} — ${result.map(({face}) => face).join(', ')}`;
  diceResult.hidden = false;
  delete diceResult.dataset.celebration;
  if (rareFigures.has(hand)) {
    void diceResult.offsetWidth;
    diceResult.dataset.celebration = hand === 'Yahtzee' ? 'yahtzee' : 'rare';
  }
}

function showDigitalDice(values) {
  if (!digitalScreen) return;
  digitalScreen.hidden = false;
  digitalDice.forEach((die, index) => setFace(die, values[index]));
}

function showOrbitalDice(values) {
  if (!orbitalProjector) return;
  orbitalProjector.hidden = false;
  orbitalDice.forEach((die, index) => setFace(die, values[index]));
}

function resetDice(clearResult = true) {
  readyAt = 0;
  if (rollTimer !== null) clearInterval(rollTimer);
  rollTimer = null;
  if (!clearResult && !diceResult.classList.contains('rolling')) {
    cooldown();
    return;
  }
  diceResult.hidden = true;
  diceResult.classList.remove('rolling');
  delete diceResult.dataset.celebration;
  diceSummary.textContent = '';
  diceAnnouncement.textContent = '';
  if (digitalScreen) digitalScreen.hidden = true;
  if (orbitalProjector) {
    orbitalProjector.hidden = true;
    orbitalProjector.classList.remove('rolling');
  }
  cooldown();
}

function diceRoll() {
  if (campaignFinished || passageRequested || phase < 1 || readyAt > performance.now()) return;
  readyAt = performance.now() + diceCooldownMs;
  cooldown();
  if (rollTimer !== null) clearInterval(rollTimer);
  delete diceResult.dataset.celebration;
  dice.forEach(die => { die.dataset.group = '0'; });
  diceSummary.textContent = 'Lancer…';
  diceAnnouncement.textContent = '';
  diceResult.hidden = false;
  diceResult.classList.add('rolling');

  const rollFaces = () => dice.map(() => Math.floor(Math.random() * 6) + 1);
  let values = rollFaces();
  if (upgrades.luck && Math.random() < .15) {
    const second = rollFaces();
    if ((ranks[combination(second)] ?? 0) > (ranks[combination(values)] ?? 0)) values = second;
  }
  showDigitalDice(values);
  showOrbitalDice(values);
  orbitalProjector?.classList.add('rolling');
  const settleAt = performance.now() + (orbitalProjector ? 1040 : 650);
  rollTimer = setInterval(() => {
    if (performance.now() < settleAt) {
      const preview = rollFaces();
      preview.forEach((face, index) => setFace(dice[index], face));
      showDigitalDice(preview);
      showOrbitalDice(preview);
      return;
    }
    clearInterval(rollTimer);
    rollTimer = null;
    diceResult.classList.remove('rolling');
    orbitalProjector?.classList.remove('rolling');
    const hand = combination(values);
    const success = Boolean(ranks[hand]);
    showDice(values, hand);
    log('Dés : ' + values.join('-') + ' — ' + hand, 'dice', success);
    if (success) protectStamina(hand);
    completedRolls++;
    updateObjectives();
    if (!campaign && phase === 1 && ['Brelan', 'Full', 'Carré', 'Grande suite', 'Yahtzee'].includes(hand)) gotoPhase(2, 'dice');
  }, 65);
}

const objectives = get('objectives');

const objectiveHint = get('objective-hint');

let campaignFinished = false;

let readyToAdvance = false;

function updateObjectives() {
  if (!campaign) return;
  const counts = [Math.floor(steps / 10), knowledgeLevel, completedRolls];
  readyToAdvance = counts.every((count, index) => count >= targets[index]);
  objectiveHint.hidden = phase > 0;
  objectiveCounters.forEach((counter, index) => {
    counter.textContent = Math.min(counts[index], targets[index]) + ' / ' + targets[index];
    counter.dataset.done = String(counts[index] >= targets[index]);
  });
  objectiveAction.disabled = !readyToAdvance || passageRequested;
  objectiveAction.textContent = campaignFinished ? 'Nouvelle partie'
    : era.number === 5 ? 'Achever le voyage' : 'Passer à l’ère suivante';
  objectiveStatus.textContent = campaignFinished ? 'Campagne terminée. ' + era.progression.complete
    : readyToAdvance ? era.progression.complete : '';
}

function showObjectiveStudyTime(now) {
  if (!campaign) return;
  const studying = studyEndAt > now;
  const available = knowledgeLevel < targets[1] && !campaignFinished && !passageRequested;
  objectiveStudyTime.hidden = !available || (!studying && studyReadyAt <= now);
  if (objectiveStudyTime.hidden) return;
  const text = studying ? 'Étude en cours · ' + Math.ceil((studyEndAt - now) / 1000) + ' s'
    : 'Reprise de l’étude dans ' + Math.ceil((studyReadyAt - now) / 1000) + ' s';
  if (objectiveStudyTime.textContent !== text) objectiveStudyTime.textContent = text;
}

objectiveAction.addEventListener('click', () => {
  if (!campaign || !readyToAdvance || passageRequested) return;

    passageRequested = true;

  }
  if (era.number === 5) {
    campaignFinished = true;
    studyEndAt = 0;
    resetDice(false);
    log(era.progression.complete, 'lore', true);
    refresh();
    updateObjectives();
    return;
  }
  passageRequested = true;
  resetDice(false);

});

const upgradeRows = new Map();

function renderStudyMenu() {
  const now = performance.now();
  const studying = studyEndAt > now;
  const state = `${phase}:${knowledgeLevel}:${studying}`;
  if (state === studyMenuState) return;
  studyMenuState = state;
  stationStudies.replaceChildren();
  knowledgeStages.forEach(({label, text}, index) => {
    const item = document.createElement('li');
    const name = document.createElement('strong');
    const done = index < knowledgeLevel;
    const current = index === knowledgeLevel;
    item.dataset.state = done ? 'done' : 'pending';
    name.textContent = label;
    const detail = done ? text : current && studying ? 'Étude en cours.' : current && phase >= 1 ? 'À étudier.' : 'À débloquer.';
    item.append(name, ' · ' + detail);
    stationStudies.append(item);
  });
}

function refreshStationMenu() {
  if (!openStation) return;
  if (openStation === 'study') {
    renderStudyMenu();
    if (stationStatus.textContent !== studyHint.textContent) stationStatus.textContent = studyHint.textContent;
    return;
  }
  if (openStation === 'window') {
    const text = campaign ? objectiveStatus.textContent || 'Les objectifs de l’ère sont dans le panneau à droite.' : '';
    if (stationStatus.textContent !== text) stationStatus.textContent = text;
    stationStatus.hidden = !campaign;
    stationPassage.hidden = !campaign || objectiveAction.disabled;
    if (stationPassage.textContent !== objectiveAction.textContent) stationPassage.textContent = objectiveAction.textContent;
    return;
  }
  const status = [];
  if (antiqueUpgrades) status.push(parts + ' pièce' + (parts === 1 ? '' : 's') + ' d’atelier · 1 par tour complet');
  if (openStation === 'dice') {
    if (phase < 1) status.push('Le premier tour débloque les lancers.');
    else if (rollTimer !== null) status.push('Lancer en cours.');
    else if (readyAt > 0) status.push('Recharge · ' + Math.ceil((readyAt - performance.now()) / 1000) + ' s');
    else status.push('Dés disponibles.');
  }
  const text = status.join(' — ');
  if (stationStatus.textContent !== text) stationStatus.textContent = text;
  stationStatus.hidden = !text;
  if (!antiqueUpgrades) return;
  const state = [openStation, parts, knowledgeLevel, campaignFinished, passageRequested, ...Object.keys(upgrades)].join(':');
  if (state === optionsMenuState) return;
  optionsMenuState = state;
  for (const upgrade of upgradeGroups[openStation]) {
    const {button} = upgradeRows.get(upgrade.id);
    const bought = Boolean(upgrades[upgrade.id]);
    button.textContent = bought ? 'Acquise' : 'Acheter · ' + upgrade.cost;
    button.disabled = bought || campaignFinished || passageRequested || parts < upgrade.cost || (upgrade.study && !knowledgeLevel);
    button.setAttribute('aria-label', bought ? upgrade.name + ' acquise' : 'Acheter ' + upgrade.name + ' pour ' + upgrade.cost + ' pièce(s)');
  }
}

function runStationAutomation(now) {
  if (campaignFinished || passageRequested || document.hidden || stationMenu.open) return;
  if (upgrades.autoDice && now >= autoDiceAt && !diceAction.disabled) {
    autoDiceAt = now + diceCooldownMs;
    diceRoll();
  }
  if (upgrades.autoWheel && now >= autoWheelAt) {
    autoWheelAt = now + 5000;
    const canPay = phase === 0 || now < staminaProtectedUntil || stamina >= WHEEL_COST;
    if (canPay) stepWheel();
  }
}

      dice: ['Yahtzee · Chance', antiqueUpgrades ? 'Améliore les chances, la protection d’endurance ou le rythme des lancers.' : 'Chance, gains et automatisation des lancers. Améliorations à définir pour cette ère.'],

 steps=0;clicks=0;phase=0;times=[];completedRolls=0;
 campaignFinished=false;passageRequested=false;

 resetStationProgress();
 if(arrivalCharacter){

setInterval(()=>{
 rate();cooldown();updateResources();completeStudy();renderStudy();updateSceneActions();

const examples = [
  ['Paire', [2, 6, 4, 2, 1]],
  ['Double paire', [4, 2, 6, 4, 2]],
  ['Brelan', [4, 2, 4, 5, 4]],
  ['Carré', [5, 5, 3, 5, 5]],
  ['Full', [3, 2, 3, 2, 2]],
  ['Petite suite', [5, 3, 2, 4, 2]],
