<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jeu incrémental · V0.20</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 "Segoe UI", Arial, sans-serif; background: #12100e; color: #f5e6cd; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; flex-wrap: wrap; gap: .45rem 1.6rem; padding: 1rem clamp(.8rem, 4vw, 3rem); border-bottom: 1px solid #645037; background: #1f1a14; }
    h1 { margin: 0; font: 1.48rem Georgia, serif; color: #fff0d3; }
    nav { display: flex; gap: .35rem; flex-wrap: wrap; }
    button { font: inherit; cursor: pointer; }
    nav button { color: #ead7b8; background: transparent; border: 1px solid transparent; border-radius: .35rem; padding: .38rem .7rem; font-size: .875rem; }
    nav button:hover { background: #382e21; }
    nav button[aria-pressed="true"] { background: #4c3620; color: #fff0d3; border-color: #c7995c; }
    button:focus-visible { outline: 2px solid #ffe2a1; outline-offset: 3px; }
    .atelier-era { display: inline-flex; align-items: center; gap: .45rem; font-size: .875rem; color: #ead7b8; }
    .atelier-era[hidden] { display: none; }
    .atelier-era select { font: inherit; color: #fff0d3; padding: .32rem .46rem; border: 1px solid #a37a4b; border-radius: .35rem; background: #47321f; }
    .atelier-era select:focus-visible { outline: 2px solid #ffe2a1; outline-offset: 2px; }
    main { display: flex; flex: 1 0 auto; flex-direction: column; }

      nav button { padding: .33rem .53rem; }
      iframe { min-height: 580px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Jeu incrémental · V0.20</h1>
    <nav aria-label="Vues du prototype">
      <button type="button" data-view="campagne" aria-pressed="true">Campagne</button>
      <button type="button" data-view="des" aria-pressed="false">Décor complet</button>
      <button type="button" data-view="roue" aria-pressed="false">Roue</button>
      <button type="button" data-view="papyrus" aria-pressed="false">Grimoire</button>
      <button type="button" data-view="decor" aria-pressed="false">Décor seul</button>
      <button type="button" data-view="interface" aria-pressed="false">Interface</button>

    <label id="atelier-era" class="atelier-era">Phase <select id="atelier-era-select"><option value="antique" selected>P1 · Antiquité</option><option value="medieval">P2 · Moyen Âge</option><option value="industrial">P3 · Moderne et contemporaine</option><option value="ai">P4 · Ère de l’IA</option><option value="future">P5 · Futuriste</option></select></label>
  </header>
  <main id="apercus" aria-label="Aperçu interactif"></main>
  <template id="styles-antique"><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#dedbd2;background:#070a0d}
*{box-sizing:border-box}
body{margin:0;background:#070a0d}
button{font-family:inherit}
.game{min-height:100vh;display:flex;flex-direction:column}
.dev{height:35px;flex:none;display:flex;align-items:center;gap:8px;padding:0 11px;background:#e8ecf0;color:#4f5a62;border-bottom:1px solid #c1cbd3;font:11px Arial,sans-serif;white-space:nowrap}
.devbrand{font-weight:800;letter-spacing:1px;font-size:9px;color:#4c7287}
.dev strong{color:#223846}
.sep{height:16px;width:1px;background:#bec7ce;margin:0 2px}
.phase-label{font-weight:800;font-variant-numeric:tabular-nums;color:#283d4b;cursor:help}
.dev button{height:24px;min-width:25px;padding:2px 7px;border:1px solid #c5ced5;background:#fff;border-radius:3px;cursor:pointer;color:#4a5861;font-size:11px}
.dev button:disabled{opacity:.4;cursor:default}
.dev button:not(:disabled):hover{background:#f6fafb}
.wheel-counter{font:600 11px Consolas,monospace;color:#304b5f;min-width:91px;font-variant-numeric:tabular-nums}
.dev-spacer{flex:1;min-width:30px}
.stage{flex:1;min-height:520px;display:grid;grid-template-columns:minmax(0,1fr) minmax(245px,29vw);overflow:hidden}
.stage.has-info{grid-template-columns:minmax(170px,18vw) minmax(0,1fr) minmax(245px,26vw)}
.infos{display:none;background:#151c1c;border-right:1px solid #354039;padding:16px 12px;color:#d5d8d2}
.has-info .infos{display:block}
.infos h2{font-size:14px;margin:0 0 18px}
.stat{padding:10px;background:#ffffff0a;border:1px solid #ffffff16;border-radius:5px;margin-bottom:10px}
.stat .label{font-size:10px;color:#9fa9a0;margin-bottom:6px}
.stat .value{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums}
.room{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:520px;background:radial-gradient(ellipse at 50% 50%,#171b1d 0%,#0d1114 47%,#080a0d 85%);transition:background 1.4s ease}
.room.lit{background:radial-gradient(ellipse at 48% 58%,#5b4b3b 0%,#282721 40%,#0d1010 84%)}
.room:after{content:'';position:absolute;inset:0;pointer-events:none;z-index:9;background:radial-gradient(ellipse at 50% 52%,transparent 10%,#05090c70 85%)}
.room.lit:after{background:radial-gradient(ellipse at 50% 52%,transparent 30%,#0306056b 95%)}
.room .light{position:absolute;left:50%;top:43%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,#ffc5764d,transparent 64%);opacity:0;pointer-events:none;z-index:1;transition:opacity 1.4s ease}
.room.lit .light{opacity:.8}
.artifact{position:relative;width:min(480px,95%,75vh);aspect-ratio:1;z-index:2;opacity:.025;filter:brightness(.22) grayscale(.65);transition:opacity 1s ease,filter 1.4s ease;cursor:pointer}
.room.lit .artifact{opacity:1;filter:brightness(.89) saturate(.83)}
.artifact img{width:100%;height:100%;position:absolute;top:0;left:0;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}
.artifact .wheelimage{transform-origin:50% 39.6153846%;transform:rotate(0deg);transition:transform .30s cubic-bezier(.26,.78,.22,1);will-change:transform;backface-visibility:hidden}
.artifact .wheelimage.instant,.artifact .rotation-index.instant{transition:none}
.artifact .rotation-index{position:absolute;inset:0;z-index:2;pointer-events:none;transform-origin:50% 39.6153846%;transform:rotate(0deg);transition:transform .30s cubic-bezier(.26,.78,.22,1);will-change:transform;backface-visibility:hidden}
.artifact .rotation-index:after{content:'';position:absolute;top:5.7%;left:calc(50% + 15px);width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#ffe5b1,#a56e31 75%);border:1px solid #614323;box-shadow:0 0 2px #0009;opacity:.90}
.artifact .stoneimage{z-index:3}
.artifact .wheel-button{position:absolute;left:15%;top:4.5%;width:70%;height:70%;border:0;border-radius:50%;background:transparent;z-index:4;cursor:pointer;opacity:0;touch-action:manipulation}
.artifact .wheel-button:focus-visible{outline:2px dashed #ddbc78;outline-offset:1px;opacity:1}
.artifact .wheel-button:disabled{cursor:default}
/* Compartiment sculpté directement DANS le socle en pierre. La meule et le socle sont inchangés. */
.stone-compartment{position:absolute;left:23.5%;top:68.5%;width:57%;height:20%;z-index:5;visibility:hidden;opacity:0;pointer-events:none;transform:translateY(4%);transition:opacity .2s ease,transform .2s ease}
.room.has-dice .stone-compartment{visibility:visible;opacity:1;transform:translateY(0);pointer-events:auto;transition:opacity .35s ease,transform .8s ease,visibility 0s}
.stone-niche{position:absolute;inset:1%;border-radius:21% 21% 15% 15% / 24% 24% 22% 22%;background:linear-gradient(172deg,#1a1611 0%,#2f2116 38%,#090b0b 78%,#12110e 100%);border:5px solid #9a8e72;box-shadow:0 3px 3px #000c,inset 0 9px 18px #000,inset 0 -3px 6px #8a6b453e,0 0 0 3px #554c3c,0 0 0 6px #ccb99468;overflow:hidden}
.stone-niche:before{content:'';position:absolute;inset:-2px;pointer-events:none;border-radius:inherit;background:linear-gradient(90deg,#63764f80,transparent 20%,transparent 82%,#5774428a),linear-gradient(to bottom,#d0b99235,transparent 28%,transparent 70%,#a9956852)}
.stone-shutter{position:absolute;z-index:3;inset:1% 1.5% 4%;border:5px groove #c5b998;border-radius:23% 23% 15% 15% / 22% 22% 22% 22%;background:radial-gradient(ellipse at 20% 30%,#bbb09a,#847d68 55%,#676451),repeating-linear-gradient(110deg,#8d8371 0px,#d6c4aa 3px,#847866 6px);box-shadow:0 4px 10px #0008, inset 0 2px 4px #e2d1b199;transform:translateY(0);opacity:1;pointer-events:none;transition:transform .9s cubic-bezier(.24,.74,.26,1),opacity .9s ease;}
.room.has-dice .stone-shutter{transform:translateY(68%) scale(.88);opacity:0;}
.dice-dock{position:absolute;inset:7% 7% 0%;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;opacity:0;transform:translateY(27%);pointer-events:none;transition:opacity .8s ease .35s,transform 1s cubic-bezier(.2,.8,.3,1) .24s}
.room.has-dice .dice-dock{opacity:1;transform:translateY(0);pointer-events:auto}
.dice-rail{display:flex;gap:3px;position:relative;overflow:hidden;padding:7px 10px 10px;border:3px solid #d3a065;border-top:5px solid #deb578;border-bottom:8px solid #8d512a;border-radius:48% 48% 28% 28% / 27% 27% 49% 49%;cursor:pointer;background:linear-gradient(175deg,#683b21 3%,#bd7c46 30%,#dfa46c 63%,#85502e 100%);box-shadow:inset 0 4px 8px #3c1e15b5,0 2px 2px #0009,0 7px 9px #0008;min-height:48px;min-width:0}
.dice-rail:before{content:'';position:absolute;inset:1px 5px auto;height:7px;border-radius:50%;background:#301b1299;pointer-events:none}
.progress{position:absolute;inset:0 auto 0 0;width:0;background:#c7bd9d88;pointer-events:none}
.die{position:relative;z-index:1;width:25px;height:25px;border:1px solid #bdaf8d;border-radius:4px;background:linear-gradient(155deg,#ffffeb,#dbcfb4);display:grid;place-items:center;font:25px/1 Arial,sans-serif;color:#403a2e;box-shadow:0 1px 3px #23190a70}
.die svg{display:block;width:100%;height:100%}
.dice-rail.cooldown .die{filter:grayscale(.9);opacity:.40}
.die.rolling{animation:die-shake .12s linear infinite alternate}
@keyframes die-shake{from{transform:translateY(-4px) rotate(-9deg)}to{transform:translateY(3px) rotate(10deg)}}
.cool{font-size:10px;color:#e1cdb1;min-width:40px;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000}
.cool.ready{color:#d2e9c0;font-weight:700}
.journal-panel{min-width:0;background:#0c1114;border-left:1px solid #293034;color:#d5d8d2;display:flex;flex-direction:column}
.journal-head{font-size:15px;font-weight:700;padding:15px 13px 11px;border-bottom:1px solid #ffffff17}
/* P0: no journal chrome; the prose alone starts the story. */
.filters{display:flex;gap:14px;padding:9px 12px;border-bottom:1px solid #ffffff17;background:#ffffff05}
.filters label{font-size:11px;display:flex;align-items:center;gap:5px;cursor:pointer}
.filters input{margin:0;width:13px;height:13px;accent-color:#ba996b}
.journal{flex:1;min-height:0;max-height:calc(100vh - 125px);overflow-y:auto;padding:9px 8px;display:flex;flex-direction:column;gap:5px}
.entry{font-size:10px;line-height:1.4;padding:5px 6px;background:#ffffff06;color:#b9c0bd;border-left:2px solid #ffffff12;font-variant-numeric:tabular-nums}
.entry.lore{white-space:normal;font-size:12px;line-height:1.55;padding:11px 10px;background:#9d855918;border-left-color:#b19c6c;color:#dfd4bf}
.entry.dice{color:#b0bbca}
.entry.success{color:#b2e0bc;border-left-color:#6baf85}
.entry[hidden]{display:none!important}
@media(max-width:760px){.stage,.stage.has-info{grid-template-columns:minmax(0,1fr) minmax(175px,38vw)}.stage.has-info .infos{display:none}.room{min-height:460px}.journal{max-height:calc(100vh - 100px)}.artifact{width:min(410px,100%)}.die{width:21px;height:21px;font-size:20px}.dev-spacer{display:none}}
@media(prefers-reduced-motion:reduce){.artifact .wheelimage,.artifact .rotation-index{transition-duration:.01ms}.die.rolling{animation-duration:.15s}}

/* V0.8 — feuille de personnage et expérience, révélées à P1 */
.stage.has-rpg{grid-template-columns:clamp(168px,18vw,225px) minmax(0,1fr) minmax(245px,26vw)}
.rpg-panel{display:none;min-width:0;overflow-y:auto;background:linear-gradient(145deg,#191e1c,#111617);border-right:1px solid #514938;padding:13px 10px;color:#dfd6c1}
.stage.has-rpg .rpg-panel{display:block}
.character-sheet{background:linear-gradient(130deg,#201f1a,#151b1b);border:1px solid #675b46;box-shadow:inset 0 1px 0 #d5b77a16,0 3px 11px #0005;border-radius:4px;padding:8px 7px 10px}
.sheet-caption{color:#b1a38b;font-size:10px;font-weight:bold;letter-spacing:.7px;text-align:center;margin:2px 0 10px}
.sheet-section{width:100%;border:1px solid #8d7853;background:linear-gradient(#3d3427,#282922);color:#e6d7b5;padding:10px 9px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:bold;cursor:pointer;border-radius:3px}
.sheet-section:hover{background:linear-gradient(#4d412c,#2a3029)}
.sheet-section:focus-visible{outline:2px solid #dab779;outline-offset:2px}
.chevron{font-size:15px;opacity:.8}
.attributes-body{padding:12px 5px 4px}
.attributes-body[hidden]{display:none}
.attribute + .attribute{margin-top:17px}
.attribute-heading{display:flex;justify-content:space-between;align-items:baseline;gap:5px;font-size:12px;margin-bottom:6px}
.attribute-heading strong{font-size:11px;font-weight:bold;font-variant-numeric:tabular-nums;white-space:nowrap}
.attribute-track{height:10px;border:1px solid #756b58;border-radius:7px;overflow:hidden;background:#070a0c;box-shadow:inset 0 1px 3px #000}
.attribute-fill{display:block;height:100%;border-radius:6px;transition:width .13s linear}
.stamina-fill{background:linear-gradient(90deg,#6f9870,#b8d39b);box-shadow:0 0 7px #7ba77855}
.vitality-fill{background:linear-gradient(90deg,#8f464a,#d38b76);box-shadow:0 0 7px #c6716f55}
.attribute-caption{display:flex;justify-content:space-between;gap:2px;margin-top:5px;font-size:9px;color:#b0ad9e}
.rpg-panel .infos{background:transparent;border:0;border-top:1px solid #514938;margin-top:13px;padding:15px 0 0}
.rpg-panel .infos h2{margin-bottom:12px}
.rpg-panel .stat{padding:8px;margin-bottom:8px}
.rpg-panel .stat .value{font-size:18px}
.xp-panel{display:none;flex:none;padding:5px 9px 7px;background:#101616;border-top:1px solid #5b513e;min-height:35px}
.game.has-rpg .xp-panel{display:block}
.xp-track{height:23px;position:relative;background:#0b0e11;border:1px solid #7e7155;border-radius:3px;overflow:hidden;box-shadow:inset 0 2px 5px #0009}
.xp-fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#6e6336,#a38c45,#ddbc71);transition:width .35s ease}
.xp-label{position:absolute;inset:0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;font:10px Arial,sans-serif;color:#efe9d7;text-shadow:0 1px 2px #000,0 1px 4px #000;font-variant-numeric:tabular-nums}
.xp-label strong{font-size:11px}
.dev-rpg-tests{display:flex;align-items:center;gap:5px}
.dev .xp-test{display:flex;align-items:center;gap:4px;font-size:10px;white-space:nowrap}
.dev .xp-test input{width:41px;height:22px;border:1px solid #bdc5ca;background:#fff;border-radius:3px;padding:2px 3px;font-size:11px;text-align:center}
.dev .dev-rpg-tests button{font-size:10px;padding:2px 6px}
.dev-exp-fixed{font-size:10px;font-weight:700;color:#396047}
.freeze-indicator{margin:12px 0 0;padding:7px 6px;background:#254935;border:1px solid #739c79;color:#dbf4da;border-radius:3px;font-size:10px}
.freeze-indicator[hidden]{display:none}
.unspent-points{border-top:1px solid #756b5833;padding-top:10px;margin-top:12px;font-size:10px;color:#d9cbb2}
.unspent-points>div{display:flex;gap:6px;justify-content:space-between;margin:7px 0}
.unspent-points strong{font-variant-numeric:tabular-nums;color:#e9c77b;font-size:12px}
@media(max-width:880px){.game{min-width:725px}.stage.has-rpg{grid-template-columns:170px minmax(0,1fr) 225px}.dev{overflow-x:auto}.dev-spacer{min-width:4px}.xp-label{font-size:9px}}

/* V1.4 — 5 régions sémantiques: effets supérieurs, volet personnage, pièce,
   volet récit/connaissances et expérience inférieure. Les éléments restent masqués
   tant que le joueur ne les a pas découverts. */
.effects-band{height:0;flex:none;display:none;align-items:center;justify-content:space-between;padding:3px 16px;gap:12px;background:linear-gradient(90deg,#14201c,#111719 50%,#211719);border-bottom:1px solid #3c463f}
.effects-band.visible{height:51px;display:flex}
.effects-left,.effects-right{display:flex;align-items:center;gap:7px;min-height:42px}
.effect-chip{width:42px;height:42px;border-radius:50%;position:relative;display:grid;place-items:center;border:1px solid #779780;box-shadow:0 0 12px #548a5b33;background:#253d32;cursor:help;font-variant-numeric:tabular-nums}
.effect-core{position:absolute;inset:4px;background:#102019;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#cce3cd;box-shadow:inset 0 0 4px #000}
.effect-symbol{font-size:15px;line-height:16px}.effect-time{font-size:10px;line-height:12px;font-weight:700}
.effect-chip[hidden],.effects-band[hidden]{display:none!important}

/* V1.0 — direction artistique de l'interface et progression visuelle par phase. */
.room{background:radial-gradient(ellipse at 50% 46%,#16191c 0%,#0d1013 48%,#06080b 88%)}
.room.lit{background:radial-gradient(ellipse at 48% 52%,#5a4b3b 0%,#2b2723 33%,#131111 68%,#090a0c 100%)}
.room:before{content:'';position:absolute;inset:auto 0 0;height:34%;background:linear-gradient(to top,#15110f,#0d0f11 70%,transparent);opacity:.92;pointer-events:none;z-index:0}
.table-scene{position:absolute;left:50%;bottom:8%;width:min(740px,96%);height:235px;transform:translateX(-50%);pointer-events:none;z-index:1;opacity:.03;transition:opacity 1s ease,transform 1s ease;filter:brightness(.68) saturate(.7)}
.room.lit .table-scene{opacity:.98;filter:brightness(1) saturate(1)}
.table-top,.table-front,.table-leg{position:absolute;background:linear-gradient(180deg,#4e3422,#2c1c14);box-shadow:0 8px 18px #0008,inset 0 1px 0 #8c613f55}
.table-top{left:7%;right:7%;top:22px;height:44px;border-radius:10px 10px 8px 8px;border:1px solid #6b4c31;background:linear-gradient(180deg,#5a3b27,#392417 65%,#21150f);overflow:hidden}
.table-top:before,.table-front:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,#ffffff07 22px 24px,transparent 24px 46px)}
.table-front{left:11%;right:11%;top:55px;height:26px;border:1px solid #5f442d;border-top:0;border-radius:0 0 10px 10px;background:linear-gradient(180deg,#3c2619,#261710)}
.table-leg{width:24px;height:126px;top:73px;border:1px solid #503623;background:linear-gradient(180deg,#3a261a,#221510)}
.table-leg.left{left:18%}.table-leg.right{right:18%}
.table-shadow{position:absolute;left:14%;right:14%;top:43px;height:50px;border-radius:50%;background:radial-gradient(ellipse at center,#0008 0%,#0003 45%,transparent 75%)}
.artifact{z-index:3;width:min(445px,78%,70vh);margin-top:22px}
.room.lit .artifact{filter:brightness(.95) saturate(.88)}
.book-assembly{right:10%;bottom:24%;width:172px;gap:7px;z-index:12}
.room.lit .book-assembly{opacity:1;visibility:visible;transform:translateY(0)}
.book-button{width:156px;height:118px;border-radius:16px;filter:drop-shadow(0 10px 10px #000c)}
.book-button:before{content:'';position:absolute;left:8px;right:14px;bottom:15px;height:16px;border-radius:50%;background:radial-gradient(ellipse at center,#0007 0%,#0000 70%)}
.grimoire{position:absolute;left:14px;top:32px;width:94px;height:61px;transform:rotate(-8deg)}
.grimoire-cover,.grimoire-pages,.grimoire-clasp,.grimoire-runes,.inkwell,.quill,.quill-tip{position:absolute;display:block}
.grimoire-pages{left:7px;top:8px;width:83px;height:48px;border-radius:7px 11px 9px 6px;background:linear-gradient(180deg,#d9c59a,#f1e4c4 28%,#ceb387 80%,#b18d61);box-shadow:2px 4px 0 #442d1f,0 0 0 1px #8e6d47,inset 0 -2px 5px #a7865e}

.study-motion {
  position: absolute; inset: var(--study-inset, 12% 6% 8%); z-index: 1; pointer-events: none;
  border-radius: var(--study-radius, 18%); overflow: hidden;
  opacity: 0; transition: opacity .22s ease;
}
.study-motion::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse, var(--study-light, #ffda8178), transparent 81%);
}
.study-motion::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(var(--study-angle, 106deg), transparent 34%, var(--study-glint, #fff2bca6) 50%, transparent 66%);
  mask-image: radial-gradient(ellipse, #000 42%, transparent 80%);
  background-size: 250% 250%; background-repeat: no-repeat;
}
.study-active .study-motion { opacity: 1; }
.study-active .study-motion::before { animation: study-light 2.6s ease-in-out infinite; }
.study-active .study-motion::after { animation: study-sweep 2.6s ease-in-out infinite; }
@keyframes study-light { 0%, 100% { opacity: .46; } 50% { opacity: 1; } }
@keyframes study-sweep {
  0% { opacity: 0; background-position: 140% 140%; }
  28%, 56% { opacity: .95; }
  80%, 100% { opacity: 0; background-position: -40% -40%; }
}
.game[data-era="medieval"] { --study-light: #a39cff8a; --study-glint: #91f9ffb5; --study-inset: 5% 16% 10% 10%; }
.game[data-era="industrial"] { --study-light: #f7c98371; --study-glint: #ffd696b5; --study-inset: 4% 8% 11%; }
.game[data-era="ai"] { --study-light: #58eec08e; --study-glint: #9affdcb5; --study-inset: 4% 4% 33%; --study-angle: 0deg; --study-radius: 4%; }
.game[data-era="future"] { --study-light: #ec9c5888; --study-glint: #e1b3ffb5; --study-inset: 5%; --study-radius: 50%; }

<script>

const diceCooldownMs = 10_000;
// Figures retenues dans moins de 5 % des lancers avec le classement actuel.
const rareFigures = new Set(['Carré', 'Full', 'Grande suite', 'Yahtzee']);

function cooldown() {
  const remaining = Math.max(0, readyAt - performance.now());
  if (!remaining) readyAt = 0;
  const charging = phase >= 1 && remaining > 0;
  diceAction.disabled = campaignFinished || passageRequested || phase < 1 || charging;
  diceAction.classList.toggle('cooling', charging);
  diceAction.style.setProperty('--recharge', charging ? String(1 - remaining / diceCooldownMs) : '0');
}

function arrangedDice(values, hand) {
  const faces = [...new Set(values)].sort((a, b) => a - b);
  const matching = count => faces.filter(face => values.filter(value => value === face).length === count);
  let groups = [];

  switch (hand) {
    case 'Paire': groups = [Array(2).fill(matching(2)[0])]; break;
    case 'Double paire': groups = matching(2).map(face => [face, face]); break;
    case 'Brelan': groups = [Array(3).fill(matching(3)[0])]; break;
    case 'Carré': groups = [Array(4).fill(matching(4)[0])]; break;
    case 'Full': groups = [Array(3).fill(matching(3)[0]), Array(2).fill(matching(2)[0])]; break;
    case 'Yahtzee': groups = [values.slice()]; break;
    case 'Petite suite': {
      const start = faces.find(face => [face + 1, face + 2, face + 3].every(next => faces.includes(next)));
      groups = [[start, start + 1, start + 2, start + 3]];
      break;
    }
    case 'Grande suite': groups = [faces]; break;
  }

  const rest = values.slice();
  const ordered = groups.flatMap((group, index) => group.map(face => {
    rest.splice(rest.indexOf(face), 1);
    return { face, group: index + 1 };
  }));
  return ordered.concat(rest.map(face => ({ face, group: 0 })));
}

function showDice(values, hand) {
  showDigitalDice(values);
  const result = arrangedDice(values, hand);
  showOrbitalDice(result.map(({face}) => face));
  result.forEach(({ face, group }, index) => {
    const die = dice[index];
    setFace(die, face);
    die.dataset.group = String(group);
  });
  diceSummary.textContent = hand;
  diceAnnouncement.textContent = `${hand} — ${result.map(({face}) => face).join(', ')}`;
  diceResult.hidden = false;
  delete diceResult.dataset.celebration;
  if (rareFigures.has(hand)) {
    void diceResult.offsetWidth;
    diceResult.dataset.celebration = hand === 'Yahtzee' ? 'yahtzee' : 'rare';
  }
}

function showDigitalDice(values) {
  if (!digitalScreen) return;
  digitalScreen.hidden = false;
  digitalDice.forEach((die, index) => setFace(die, values[index]));
}

function showOrbitalDice(values) {
  if (!orbitalProjector) return;
  orbitalProjector.hidden = false;
  orbitalDice.forEach((die, index) => setFace(die, values[index]));
}

function resetDice(clearResult = true) {
  readyAt = 0;
  if (rollTimer !== null) clearInterval(rollTimer);
  rollTimer = null;
  if (!clearResult && !diceResult.classList.contains('rolling')) {
    cooldown();
    return;
  }
  diceResult.hidden = true;
  diceResult.classList.remove('rolling');
  delete diceResult.dataset.celebration;
  diceSummary.textContent = '';
  diceAnnouncement.textContent = '';
  if (digitalScreen) digitalScreen.hidden = true;
  if (orbitalProjector) {
    orbitalProjector.hidden = true;
    orbitalProjector.classList.remove('rolling');
  }
  cooldown();
}

function diceRoll() {
  if (campaignFinished || passageRequested || phase < 1 || readyAt > performance.now()) return;
  readyAt = performance.now() + diceCooldownMs;
  cooldown();
  if (rollTimer !== null) clearInterval(rollTimer);
  delete diceResult.dataset.celebration;
  dice.forEach(die => { die.dataset.group = '0'; });
  diceSummary.textContent = 'Lancer…';
  diceAnnouncement.textContent = '';
  diceResult.hidden = false;
  diceResult.classList.add('rolling');

  const rollFaces = () => dice.map(() => Math.floor(Math.random() * 6) + 1);
  let values = rollFaces();
  if (upgrades.luck && Math.random() < .15) {
    const second = rollFaces();
    if ((ranks[combination(second)] ?? 0) > (ranks[combination(values)] ?? 0)) values = second;
  }
  showDigitalDice(values);
  showOrbitalDice(values);
  orbitalProjector?.classList.add('rolling');
  const settleAt = performance.now() + (orbitalProjector ? 1040 : 650);
  rollTimer = setInterval(() => {
    if (performance.now() < settleAt) {
      const preview = rollFaces();
      preview.forEach((face, index) => setFace(dice[index], face));
      showDigitalDice(preview);
      showOrbitalDice(preview);
      return;
    }
    clearInterval(rollTimer);
    rollTimer = null;
    diceResult.classList.remove('rolling');
    orbitalProjector?.classList.remove('rolling');
    const hand = combination(values);
    const success = Boolean(ranks[hand]);
    showDice(values, hand);
    log('Dés : ' + values.join('-') + ' — ' + hand, 'dice', success);
    if (success) protectStamina(hand);
    completedRolls++;
    updateObjectives();
    if (!campaign && phase === 1 && ['Brelan', 'Full', 'Carré', 'Grande suite', 'Yahtzee'].includes(hand)) gotoPhase(2, 'dice');
  }, 65);
}

  const zone = get(id);
  zone.addEventListener('click', () => {
    if (stationMenu.open) return;

    stationTrigger = zone;
    studyMenuState = undefined;
    optionsMenuState = undefined;
    const labels = {
      wheel: ['Roue', antiqueUpgrades ? 'Améliore la vitesse, la poussée ou l’entraînement de la roue.' : 'Vitesse, poussée et automatisation de la roue. Améliorations à définir pour cette ère.'],
      dice: ['Yahtzee · Chance', antiqueUpgrades ? 'Améliore les chances, la protection d’endurance ou le rythme des lancers.' : 'Chance, gains et automatisation des lancers. Améliorations à définir pour cette ère.'],
      study: ['Étude · ' + era.studyName, lore.inspectBook],
      window: ['Fenêtre', era.windowDescription + '.'],
    };
    [stationTitle.textContent, stationDescription.textContent] = labels[key];
    const rows = antiqueUpgrades ? (upgradeGroups[key] ?? []).map(({id}) => upgradeRows.get(id).row) : [];
    stationOptions.replaceChildren(...rows);
    stationOptions.hidden = rows.length === 0;
    stationResearch.hidden = key !== 'study';
    stationPassage.hidden = true;
    stationStatus.hidden = rows.length === 0 && key !== 'study';
    refreshStationMenu();
    stationMenu.showModal();
  });
}

function restart(){
 steps=0;clicks=0;phase=0;times=[];completedRolls=0;
 campaignFinished=false;passageRequested=false;
 resetResources();
 resetStationProgress();
 if(arrivalCharacter){
  ({level,currentExp,vitality,intelligence,availableAttributePoints,availableTalentPoints,mana,manaUnlocked}=arrivalCharacter);
  arrivalCharacter=null;
  renderResources();
 }
 resetDice();
 total.textContent='0';cps.textContent='0,0';

 log(lore.start);

}

wheelAction.addEventListener('click', stepWheel);
studyAction.addEventListener('click', startStudy);
diceAction.addEventListener('click', diceRoll);

function updateSceneActions() {
  const now = performance.now();
  const studying = studyEndAt > now;
  const recovering = studyReadyAt > now;
  wheelAction.hidden = false;
  wheelAction.disabled = campaignFinished || passageRequested;
  studyAction.hidden = phase < 1;
  diceAction.hidden = phase < 1;
  studyAction.disabled = campaignFinished || passageRequested || phase < 1 || studying || recovering || knowledgeLevel >= knowledgeStages.length;
  studyAction.title = studying ? 'Étude en cours' : recovering ? 'Étude en recharge' : `Étudier (${STUDY_COST} END)`;
  assembly.classList.toggle('study-active', studying);
}

setInterval(()=>{
 rate();cooldown();updateResources();completeStudy();renderStudy();updateSceneActions();
 runStationAutomation(performance.now());

},100);
const examples = [
  ['Paire', [2, 6, 4, 2, 1]],
  ['Double paire', [4, 2, 6, 4, 2]],
  ['Brelan', [4, 2, 4, 5, 4]],
  ['Carré', [5, 5, 3, 5, 5]],
  ['Full', [3, 2, 3, 2, 2]],
  ['Petite suite', [5, 3, 2, 4, 2]],
  ['Grande suite', [5, 2, 4, 1, 3]],
  ['Yahtzee', [6, 6, 6, 6, 6]],
  ['Aucune combinaison', [1, 2, 3, 5, 6]]
];

function setupEssai() {
  if (reviewMode === 'partie' || campaign) return;

  const descriptions = {
    roue: ['Roue', 'Observe le disque, son axe et le bâti au fil des crans.'],
    papyrus: [era.studyName, 'Le test commence avec 10 points d’endurance.'],
    des: ['Décor complet', 'Essaie la roue, l’étude ou le Yahtzee.'],
    decor: ['Décor', 'La pièce éclairée, avec la roue au repos.'],
    interface: ['Interface', 'Change d’état de test pour voir les panneaux et les commandes qui apparaissent.']
  };
  const [title, description] = descriptions[reviewMode];
  const commands = get('essai-commandes');
  const status = get('essai-etat');
  get('essai-titre').textContent = title;
  get('essai-description').textContent = description;

  function action(label, handler) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.addEventListener('click', handler);
    commands.append(button);
    return button;
  }

  function watch(read, update) {
    let previous;
    const refreshStatus = () => {
      const next = read();
      if (next === previous) return;
      previous = next;
      status.textContent = next;
      update?.();
    };
    refreshStatus();
    setInterval(refreshStatus, 100);
  }

  switch (reviewMode) {
    case 'roue':
      action('Tourner la roue', () => wheelAction.click());
      action('Revenir au départ', () => {
        restart();
      });
      status.setAttribute('aria-live', 'polite');
      watch(() => `${steps} ${steps === 1 ? 'cran' : 'crans'} · ${steps * 36 % 360}° depuis le départ`);
      break;

    case 'papyrus': {
      gotoPhase(1, 'essai');
      stamina = maxStamina;
      renderResources();
      const study = action(era.studyAction, () => studyAction.click());
      watch(() => {
        const discovery = knowledgeStages[knowledgeLevel - 1];
        const note = discovery ? ` · ${discovery.label}. ${discovery.text}` : '';
        return `${studyHint.textContent} · Endurance ${fmt1(stamina)} / ${maxStamina}${note}`;
      }, () => {
        study.disabled = studyEndAt > performance.now() || studyReadyAt > performance.now() || knowledgeLevel >= knowledgeStages.length;
      });
      break;
    }

    case 'des': {
      gotoPhase(1, 'essai');
      stamina = maxStamina;
      renderResources();
      status.hidden = true;
      const [hand, faces] = examples[0];
      showDice(faces, hand);
      const roll = action('Lancer les cinq dés', diceRoll);
      const picker = document.createElement('select');
      picker.setAttribute('aria-label', 'Essayer une figure');
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.disabled = true;
      placeholder.textContent = 'Essayer une figure';
      picker.append(placeholder);
      examples.forEach(([name], index) => {
        const option = document.createElement('option');
        option.value = String(index);
        option.textContent = name;
        picker.append(option);
      });
      picker.value = '';
      picker.addEventListener('change', () => {
        if (picker.value === '' || rollTimer !== null) return;
        const [name, values] = examples[Number(picker.value)];
        showDice(values, name);
        picker.value = '';
      });
      commands.append(picker);
      watch(() => `${readyAt}:${rollTimer !== null}`, () => {
        roll.disabled = readyAt > performance.now();
        picker.disabled = rollTimer !== null;
      });
      break;
    }

    case 'decor':
      status.hidden = true;
      break;

    case 'interface': {
      function showPhase(target) {
        if (target === 0) restart();
        else gotoPhase(target, 'essai');
        phaseButtons.forEach((button, index) => button.setAttribute('aria-pressed', String(target === index)));
        effect.disabled = target === 0;
      }
      const phaseButtons = testStates.map((label, index) => action(label, () => showPhase(index)));
      const effect = action('Voir un effet temporaire', () => protectStamina('Brelan'));
      showPhase(0);
      status.hidden = true;
      break;
    }
  }
}

restart();
objectives.hidden = !campaign;
get('stamina-regen').textContent = '+' + fmt1(STAMINA_REGEN) + ' / sec';
setupEssai();
})();
</script>

function combination(a){
 const c=Array(7).fill(0);a.forEach(x=>c[x]++);
 const counts=c.slice(1);
 const m=Math.max(...counts);
 const unique=[...new Set(a)].sort((x,y)=>x-y);
 const straight=unique.join(',');
 const hasFourConsecutive=unique.some(v=>v<=3&&[v,v+1,v+2,v+3].every(n=>unique.includes(n)));
 const found=[];
 if(m>=2)found.push('Paire');
 if(counts.filter(x=>x===2).length>=2)found.push('Double paire');
 if(m>=3)found.push('Brelan');
 if(m>=4)found.push('Carré');
 if(counts.includes(3)&&counts.includes(2))found.push('Full');
 if(hasFourConsecutive)found.push('Petite suite');
 if(straight==='1,2,3,4,5'||straight==='2,3,4,5,6')found.push('Grande suite');
 if(m===5)found.push('Yahtzee');
 return found.length?found.reduce((a,b)=>ranks[b]>ranks[a]?b:a):'Aucune combinaison';
}

 const newDeadline=performance.now()+duration;
 if(newDeadline>=staminaProtectedUntil)staminaProtectedUntil=newDeadline;
 renderResources();
 log('Endurance protégée pendant '+(duration/1000)+' s ('+hand+').','system',true);
}
const diceCooldownMs = 10_000;
// Figures retenues dans moins de 5 % des lancers avec le classement actuel.
const rareFigures = new Set(['Carré', 'Full', 'Grande suite', 'Yahtzee']);

function cooldown() {
  const remaining = Math.max(0, readyAt - performance.now());
  if (!remaining) readyAt = 0;
  const charging = phase >= 1 && remaining > 0;
  diceAction.disabled = campaignFinished || passageRequested || phase < 1 || charging;
  diceAction.classList.toggle('cooling', charging);
  diceAction.style.setProperty('--recharge', charging ? String(1 - remaining / diceCooldownMs) : '0');
}

function arrangedDice(values, hand) {
  const faces = [...new Set(values)].sort((a, b) => a - b);
  const matching = count => faces.filter(face => values.filter(value => value === face).length === count);
  let groups = [];

  switch (hand) {
    case 'Paire': groups = [Array(2).fill(matching(2)[0])]; break;
    case 'Double paire': groups = matching(2).map(face => [face, face]); break;
    case 'Brelan': groups = [Array(3).fill(matching(3)[0])]; break;
    case 'Carré': groups = [Array(4).fill(matching(4)[0])]; break;
    case 'Full': groups = [Array(3).fill(matching(3)[0]), Array(2).fill(matching(2)[0])]; break;
    case 'Yahtzee': groups = [values.slice()]; break;
    case 'Petite suite': {
      const start = faces.find(face => [face + 1, face + 2, face + 3].every(next => faces.includes(next)));
      groups = [[start, start + 1, start + 2, start + 3]];
      break;
    }
    case 'Grande suite': groups = [faces]; break;
  }

  const rest = values.slice();
  const ordered = groups.flatMap((group, index) => group.map(face => {
    rest.splice(rest.indexOf(face), 1);
    return { face, group: index + 1 };
  }));
  return ordered.concat(rest.map(face => ({ face, group: 0 })));
}

function showDice(values, hand) {
  showDigitalDice(values);
  const result = arrangedDice(values, hand);
  showOrbitalDice(result.map(({face}) => face));
  result.forEach(({ face, group }, index) => {
    const die = dice[index];
    setFace(die, face);
    die.dataset.group = String(group);
  });
  diceSummary.textContent = hand;
  diceAnnouncement.textContent = `${hand} — ${result.map(({face}) => face).join(', ')}`;
  diceResult.hidden = false;
  delete diceResult.dataset.celebration;
  if (rareFigures.has(hand)) {
    void diceResult.offsetWidth;
    diceResult.dataset.celebration = hand === 'Yahtzee' ? 'yahtzee' : 'rare';
  }
}

function showDigitalDice(values) {
  if (!digitalScreen) return;
  digitalScreen.hidden = false;
  digitalDice.forEach((die, index) => setFace(die, values[index]));
}

function showOrbitalDice(values) {
  if (!orbitalProjector) return;
  orbitalProjector.hidden = false;
  orbitalDice.forEach((die, index) => setFace(die, values[index]));
}

function resetDice(clearResult = true) {
  readyAt = 0;
  if (rollTimer !== null) clearInterval(rollTimer);
  rollTimer = null;
  if (!clearResult && !diceResult.classList.contains('rolling')) {
    cooldown();
    return;
  }
  diceResult.hidden = true;
  diceResult.classList.remove('rolling');
  delete diceResult.dataset.celebration;
  diceSummary.textContent = '';
  diceAnnouncement.textContent = '';
  if (digitalScreen) digitalScreen.hidden = true;
  if (orbitalProjector) {
    orbitalProjector.hidden = true;
    orbitalProjector.classList.remove('rolling');
  }
  cooldown();
}

function diceRoll() {
  if (campaignFinished || passageRequested || phase < 1 || readyAt > performance.now()) return;
  readyAt = performance.now() + diceCooldownMs;
  cooldown();
  if (rollTimer !== null) clearInterval(rollTimer);
  delete diceResult.dataset.celebration;
  dice.forEach(die => { die.dataset.group = '0'; });
  diceSummary.textContent = 'Lancer…';
  diceAnnouncement.textContent = '';
  diceResult.hidden = false;
  diceResult.classList.add('rolling');

  const rollFaces = () => dice.map(() => Math.floor(Math.random() * 6) + 1);
  let values = rollFaces();
  if (upgrades.luck && Math.random() < .15) {
    const second = rollFaces();
    if ((ranks[combination(second)] ?? 0) > (ranks[combination(values)] ?? 0)) values = second;
  }
  showDigitalDice(values);
  showOrbitalDice(values);
  orbitalProjector?.classList.add('rolling');
  const settleAt = performance.now() + (orbitalProjector ? 1040 : 650);
  rollTimer = setInterval(() => {
    if (performance.now() < settleAt) {
      const preview = rollFaces();
      preview.forEach((face, index) => setFace(dice[index], face));
      showDigitalDice(preview);
      showOrbitalDice(preview);
      return;
    }
    clearInterval(rollTimer);
    rollTimer = null;
    diceResult.classList.remove('rolling');
    orbitalProjector?.classList.remove('rolling');
    const hand = combination(values);
    const success = Boolean(ranks[hand]);
    showDice(values, hand);
    log('Dés : ' + values.join('-') + ' — ' + hand, 'dice', success);
    if (success) protectStamina(hand);
    completedRolls++;
    updateObjectives();
    if (!campaign && phase === 1 && ['Brelan', 'Full', 'Carré', 'Grande suite', 'Yahtzee'].includes(hand)) gotoPhase(2, 'dice');
  }, 65);
}

function updateObjectives() {
  if (!campaign) return;
  const counts = [Math.floor(steps / 10), knowledgeLevel, completedRolls];
  readyToAdvance = counts.every((count, index) => count >= targets[index]);
  objectiveHint.hidden = phase > 0;
  objectiveCounters.forEach((counter, index) => {
    counter.textContent = Math.min(counts[index], targets[index]) + ' / ' + targets[index];
    counter.dataset.done = String(counts[index] >= targets[index]);
  });
  objectiveAction.disabled = !readyToAdvance || passageRequested;
  objectiveAction.textContent = campaignFinished ? 'Nouvelle partie'
    : era.number === 5 ? 'Achever le voyage' : 'Passer à l’ère suivante';
  objectiveStatus.textContent = campaignFinished ? 'Campagne terminée. ' + era.progression.complete
    : readyToAdvance ? era.progression.complete : '';
}

function showObjectiveStudyTime(now) {
  if (!campaign) return;
  const studying = studyEndAt > now;
  const available = knowledgeLevel < targets[1] && !campaignFinished && !passageRequested;
  objectiveStudyTime.hidden = !available || (!studying && studyReadyAt <= now);
  if (objectiveStudyTime.hidden) return;
  const text = studying ? 'Étude en cours · ' + Math.ceil((studyEndAt - now) / 1000) + ' s'
    : 'Reprise de l’étude dans ' + Math.ceil((studyReadyAt - now) / 1000) + ' s';
  if (objectiveStudyTime.textContent !== text) objectiveStudyTime.textContent = text;
}

objectiveAction.addEventListener('click', () => {
  if (!campaign || !readyToAdvance || passageRequested) return;
  if (campaignFinished) {
    passageRequested = true;
    updateObjectives();
    parent.postMessage({type: 'campaign-restart'}, '*');
    return;
  }
  if (era.number === 5) {
    campaignFinished = true;
    studyEndAt = 0;
    resetDice(false);
    log(era.progression.complete, 'lore', true);
    refresh();
    updateObjectives();
    return;
  }
  passageRequested = true;
  resetDice(false);
  updateObjectives();
  refresh();
  parent.postMessage({
    type: 'campaign-advance',
    character: {level, currentExp, vitality, intelligence, availableAttributePoints, availableTalentPoints, mana, manaUnlocked},
  }, '*');
});

const stationMenu = get('station-menu');
const stationTitle = get('station-title');
const stationDescription = get('station-description');
const stationStatus = get('station-status');
const stationOptions = get('station-options');
const stationResearch = get('station-research');
const stationStudies = get('station-studies');
const stationPassage = get('station-passage');
const antiqueUpgrades = era.number === 1;
let openStation;
let stationTrigger;
let studyMenuState;
let optionsMenuState;
let parts = 0;
let upgrades = {};
let autoWheelAt = 0;
let autoDiceAt = 0;

const upgradeGroups = {
  wheel: [
    {id:'speed', name:'Axe poli', cost:1, effect:'La rotation passe de 0,48 s à 0,26 s.'},
    {id:'force', name:'Levier de pierre', cost:1, effect:'Deux crans par pression pour le même coût en endurance.'},
    {id:'autoWheel', name:'Contrepoids', cost:2, effect:'Une pression toutes les 5 s, selon l’endurance disponible.', study:true},
  ],
  dice: [
    {id:'luck', name:'Seconde chance', cost:1, effect:'15 % de chance d’obtenir un second tirage. La meilleure figure compte.'},
    {id:'reward', name:'Offrande', cost:1, effect:'Les combinaisons prolongent la protection d’endurance de 5 s.'},
    {id:'autoDice', name:'Coupe à bascule', cost:2, effect:'Un lancer automatique dès que les dés sont rechargés.', study:true},
  ],
};

const upgradeRows = new Map();
if (antiqueUpgrades) {
  for (const upgrade of Object.values(upgradeGroups).flat()) {
    const row = document.createElement('div');
    row.className = 'station-option';
    const copy = document.createElement('div');
    const name = document.createElement('h3');
    name.textContent = upgrade.name;
    const effect = document.createElement('p');
    effect.textContent = upgrade.effect + (upgrade.study ? ' Une étude terminée requise.' : '');
    copy.append(name, effect);
    const button = document.createElement('button');
    button.type = 'button';
    button.addEventListener('click', () => {
      if (upgrades[upgrade.id] || campaignFinished || passageRequested || parts < upgrade.cost || (upgrade.study && !knowledgeLevel)) return;
      parts -= upgrade.cost;
      upgrades[upgrade.id] = true;
      if (upgrade.id === 'speed') wheelimage.style.setProperty('--wheel-duration', '.26s');
      refreshStationMenu();
    });
    row.append(copy, button);
    upgradeRows.set(upgrade.id, {row, button});
  }
}

function resetStationProgress() {
  parts = 0;
  upgrades = {};
  autoWheelAt = 0;
  autoDiceAt = 0;
  wheelimage.style.setProperty('--wheel-duration', '.48s');
  if (stationMenu.open) stationMenu.close();
}

function renderStudyMenu() {
  const now = performance.now();
  const studying = studyEndAt > now;
  const state = `${phase}:${knowledgeLevel}:${studying}`;
  if (state === studyMenuState) return;
  studyMenuState = state;
  stationStudies.replaceChildren();
  knowledgeStages.forEach(({label, text}, index) => {
    const item = document.createElement('li');
    const name = document.createElement('strong');
    const done = index < knowledgeLevel;
    const current = index === knowledgeLevel;
    item.dataset.state = done ? 'done' : 'pending';
    name.textContent = label;
    const detail = done ? text : current && studying ? 'Étude en cours.' : current && phase >= 1 ? 'À étudier.' : 'À débloquer.';
    item.append(name, ' · ' + detail);
    stationStudies.append(item);
  });
}

function refreshStationMenu() {
  if (!openStation) return;
  if (openStation === 'study') {
    renderStudyMenu();
    if (stationStatus.textContent !== studyHint.textContent) stationStatus.textContent = studyHint.textContent;
    return;
  }
  if (openStation === 'window') {
    const text = campaign ? objectiveStatus.textContent || 'Les objectifs de l’ère sont dans le panneau à droite.' : '';
    if (stationStatus.textContent !== text) stationStatus.textContent = text;
    stationStatus.hidden = !campaign;
    stationPassage.hidden = !campaign || objectiveAction.disabled;
    if (stationPassage.textContent !== objectiveAction.textContent) stationPassage.textContent = objectiveAction.textContent;
    return;
  }
  const status = [];
  if (antiqueUpgrades) status.push(parts + ' pièce' + (parts === 1 ? '' : 's') + ' d’atelier · 1 par tour complet');
  if (openStation === 'dice') {
    if (phase < 1) status.push('Le premier tour débloque les lancers.');
    else if (rollTimer !== null) status.push('Lancer en cours.');
    else if (readyAt > 0) status.push('Recharge · ' + Math.ceil((readyAt - performance.now()) / 1000) + ' s');
    else status.push('Dés disponibles.');
  }
  const text = status.join(' — ');
  if (stationStatus.textContent !== text) stationStatus.textContent = text;
  stationStatus.hidden = !text;
  if (!antiqueUpgrades) return;
  const state = [openStation, parts, knowledgeLevel, campaignFinished, passageRequested, ...Object.keys(upgrades)].join(':');
  if (state === optionsMenuState) return;
  optionsMenuState = state;
  for (const upgrade of upgradeGroups[openStation]) {
    const {button} = upgradeRows.get(upgrade.id);
    const bought = Boolean(upgrades[upgrade.id]);
    button.textContent = bought ? 'Acquise' : 'Acheter · ' + upgrade.cost;
    button.disabled = bought || campaignFinished || passageRequested || parts < upgrade.cost || (upgrade.study && !knowledgeLevel);
    button.setAttribute('aria-label', bought ? upgrade.name + ' acquise' : 'Acheter ' + upgrade.name + ' pour ' + upgrade.cost + ' pièce(s)');
  }
}

function runStationAutomation(now) {
  if (campaignFinished || passageRequested || document.hidden || stationMenu.open) return;
  if (upgrades.autoDice && now >= autoDiceAt && !diceAction.disabled) {
    autoDiceAt = now + diceCooldownMs;
    diceRoll();
  }
  if (upgrades.autoWheel && now >= autoWheelAt) {
    autoWheelAt = now + 5000;
    const canPay = phase === 0 || now < staminaProtectedUntil || stamina >= WHEEL_COST;
    if (canPay) stepWheel();
  }
}

stationPassage.addEventListener('click', () => {
  if (objectiveAction.disabled) return;
  stationMenu.close();
  objectiveAction.click();
});
stationMenu.addEventListener('close', () => {
  if (stationMenu.open) return;
  openStation = undefined;
  stationTrigger?.focus();
});
for (const [key, id] of Object.entries({wheel:'wheel-menu-zone', dice:'dice-menu-zone', study:'study-menu-zone', window:'window-menu-zone'})) {
  const zone = get(id);
  zone.addEventListener('click', () => {
    if (stationMenu.open) return;
    openStation = key;
    stationTrigger = zone;
    studyMenuState = undefined;
    optionsMenuState = undefined;
    const labels = {
      wheel: ['Roue', antiqueUpgrades ? 'Améliore la vitesse, la poussée ou l’entraînement de la roue.' : 'Vitesse, poussée et automatisation de la roue. Améliorations à définir pour cette ère.'],
      dice: ['Yahtzee · Chance', antiqueUpgrades ? 'Améliore les chances, la protection d’endurance ou le rythme des lancers.' : 'Chance, gains et automatisation des lancers. Améliorations à définir pour cette ère.'],
      study: ['Étude · ' + era.studyName, lore.inspectBook],
      window: ['Fenêtre', era.windowDescription + '.'],
    };
    [stationTitle.textContent, stationDescription.textContent] = labels[key];
    const rows = antiqueUpgrades ? (upgradeGroups[key] ?? []).map(({id}) => upgradeRows.get(id).row) : [];
    stationOptions.replaceChildren(...rows);
    stationOptions.hidden = rows.length === 0;
    stationResearch.hidden = key !== 'study';
    stationPassage.hidden = true;
    stationStatus.hidden = rows.length === 0 && key !== 'study';
    refreshStationMenu();
    stationMenu.showModal();
  });
}

function restart(){
 steps=0;clicks=0;phase=0;times=[];completedRolls=0;
 campaignFinished=false;passageRequested=false;
 resetResources();
 resetStationProgress();
 if(arrivalCharacter){
  ({level,currentExp,vitality,intelligence,availableAttributePoints,availableTalentPoints,mana,manaUnlocked}=arrivalCharacter);
  arrivalCharacter=null;
  renderResources();
 }
 resetDice();
 total.textContent='0';cps.textContent='0,0';
 journal.replaceChildren();
 wheelRender(true);
 refresh();
 log(lore.start);
 updateObjectives();
}
prev.addEventListener('click',()=>gotoPhase(phase-1,'cheat'));next.addEventListener('click',()=>gotoPhase(phase+1,'cheat'));reset.addEventListener('click',restart);

const wheelAction = get('antique-wheel-action');
const studyAction = get('antique-study-action');
const assembly = get('book-assembly');
wheelAction.addEventListener('click', stepWheel);
studyAction.addEventListener('click', startStudy);
diceAction.addEventListener('click', diceRoll);

function updateSceneActions() {
  const now = performance.now();
  const studying = studyEndAt > now;
  const recovering = studyReadyAt > now;
  wheelAction.hidden = false;
  wheelAction.disabled = campaignFinished || passageRequested;
  studyAction.hidden = phase < 1;
  diceAction.hidden = phase < 1;
  studyAction.disabled = campaignFinished || passageRequested || phase < 1 || studying || recovering || knowledgeLevel >= knowledgeStages.length;
  studyAction.title = studying ? 'Étude en cours' : recovering ? 'Étude en recharge' : `Étudier (${STUDY_COST} END)`;
  assembly.classList.toggle('study-active', studying);
}

setInterval(()=>{
 rate();cooldown();updateResources();completeStudy();renderStudy();updateSceneActions();
 runStationAutomation(performance.now());
 refreshStationMenu();
},100);
const examples = [
  ['Paire', [2, 6, 4, 2, 1]],
  ['Double paire', [4, 2, 6, 4, 2]],
  ['Brelan', [4, 2, 4, 5, 4]],
  ['Carré', [5, 5, 3, 5, 5]],
  ['Full', [3, 2, 3, 2, 2]],
  ['Petite suite', [5, 3, 2, 4, 2]],
  ['Grande suite', [5, 2, 4, 1, 3]],
  ['Yahtzee', [6, 6, 6, 6, 6]],
  ['Aucune combinaison', [1, 2, 3, 5, 6]]
];

function setupEssai() {
  if (reviewMode === 'partie' || campaign) return;

  const descriptions = {
    roue: ['Roue', 'Observe le disque, son axe et le bâti au fil des crans.'],
    papyrus: [era.studyName, 'Le test commence avec 10 points d’endurance.'],
    des: ['Décor complet', 'Essaie la roue, l’étude ou le Yahtzee.'],
    decor: ['Décor', 'La pièce éclairée, avec la roue au repos.'],
    interface: ['Interface', 'Change d’état de test pour voir les panneaux et les commandes qui apparaissent.']
  };
  const [title, description] = descriptions[reviewMode];
  const commands = get('essai-commandes');
  const status = get('essai-etat');
  get('essai-titre').textContent = title;
  get('essai-description').textContent = description;

  function action(label, handler) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.addEventListener('click', handler);
    commands.append(button);
    return button;
  }

  function watch(read, update) {
    let previous;
    const refreshStatus = () => {
      const next = read();
      if (next === previous) return;
      previous = next;
      status.textContent = next;
      update?.();
    };
    refreshStatus();
    setInterval(refreshStatus, 100);
  }

  switch (reviewMode) {
    case 'roue':
      action('Tourner la roue', () => wheelAction.click());
      action('Revenir au départ', () => {
        restart();
      });
      status.setAttribute('aria-live', 'polite');
      watch(() => `${steps} ${steps === 1 ? 'cran' : 'crans'} · ${steps * 36 % 360}° depuis le départ`);
      break;

    case 'papyrus': {
      gotoPhase(1, 'essai');
      stamina = maxStamina;
      renderResources();
      const study = action(era.studyAction, () => studyAction.click());
      watch(() => {
        const discovery = knowledgeStages[knowledgeLevel - 1];
        const note = discovery ? ` · ${discovery.label}. ${discovery.text}` : '';
        return `${studyHint.textContent} · Endurance ${fmt1(stamina)} / ${maxStamina}${note}`;
      }, () => {
        study.disabled = studyEndAt > performance.now() || studyReadyAt > performance.now() || knowledgeLevel >= knowledgeStages.length;
      });
      break;
    }

    case 'des': {
      gotoPhase(1, 'essai');
      stamina = maxStamina;
      renderResources();
      status.hidden = true;
      const [hand, faces] = examples[0];
      showDice(faces, hand);
      const roll = action('Lancer les cinq dés', diceRoll);
      const picker = document.createElement('select');
      picker.setAttribute('aria-label', 'Essayer une figure');
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.disabled = true;
      placeholder.textContent = 'Essayer une figure';
      picker.append(placeholder);
      examples.forEach(([name], index) => {
        const option = document.createElement('option');
        option.value = String(index);
        option.textContent = name;
        picker.append(option);
      });
      picker.value = '';
      picker.addEventListener('change', () => {
        if (picker.value === '' || rollTimer !== null) return;
        const [name, values] = examples[Number(picker.value)];
        showDice(values, name);
        picker.value = '';
      });
      commands.append(picker);
      watch(() => `${readyAt}:${rollTimer !== null}`, () => {
        roll.disabled = readyAt > performance.now();
        picker.disabled = rollTimer !== null;
      });
      break;
    }

    case 'decor':
      status.hidden = true;
      break;

    case 'interface': {
      function showPhase(target) {
        if (target === 0) restart();
        else gotoPhase(target, 'essai');
        phaseButtons.forEach((button, index) => button.setAttribute('aria-pressed', String(target === index)));
        effect.disabled = target === 0;
      }
      const phaseButtons = testStates.map((label, index) => action(label, () => showPhase(index)));
      const effect = action('Voir un effet temporaire', () => protectStamina('Brelan'));
      showPhase(0);
      status.hidden = true;
      break;
    }
  }
}

restart();
objectives.hidden = !campaign;
get('stamina-regen').textContent = '+' + fmt1(STAMINA_REGEN) + ' / sec';
setupEssai();
})();
</script>
</template>

.yahtzee-halo { position: absolute; z-index: 1; inset: 0; pointer-events: none; opacity: 0; filter: drop-shadow(0 0 3px #eeb46d) drop-shadow(0 0 5px #d3964480); transition: opacity .18s ease; }
.yahtzee-halo::before { content: ''; position: absolute; inset: 0; clip-path: polygon(evenodd, var(--plate-halo)); background: #efbf7a; }
#antique-dice-action:not([hidden]):not(:disabled) + .yahtzee-halo { opacity: .72; }
.yahtzee-result { position: absolute; left: 0; top: calc(100% + var(--result-gap)); width: 100%; height: 100%; padding: 2.4cqw 4cqw; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4cqw; border: 1px solid #997047; border-radius: 4.5cqw; background: #21170fef; box-shadow: 0 2px 9px #0008, inset 0 0 0 1px #d9af7733; }

}

@keyframes result-tumble { from { transform: rotate(-10deg); } to { transform: rotate(8deg); } }

function combination(a){
 const c=Array(7).fill(0);a.forEach(x=>c[x]++);
 const counts=c.slice(1);
 const m=Math.max(...counts);
 const unique=[...new Set(a)].sort((x,y)=>x-y);
 const straight=unique.join(',');
 const hasFourConsecutive=unique.some(v=>v<=3&&[v,v+1,v+2,v+3].every(n=>unique.includes(n)));
 const found=[];
 if(m>=2)found.push('Paire');
 if(counts.filter(x=>x===2).length>=2)found.push('Double paire');
 if(m>=3)found.push('Brelan');
 if(m>=4)found.push('Carré');
 if(counts.includes(3)&&counts.includes(2))found.push('Full');
 if(hasFourConsecutive)found.push('Petite suite');
 if(straight==='1,2,3,4,5'||straight==='2,3,4,5,6')found.push('Grande suite');
 if(m===5)found.push('Yahtzee');
 return found.length?found.reduce((a,b)=>ranks[b]>ranks[a]?b:a):'Aucune combinaison';
}

 if(newDeadline>=staminaProtectedUntil)staminaProtectedUntil=newDeadline;
 renderResources();
 log('Endurance protégée pendant '+(duration/1000)+' s ('+hand+').','system',true);
}
const diceCooldownMs = 10_000;
// Figures retenues dans moins de 5 % des lancers avec le classement actuel.
const rareFigures = new Set(['Carré', 'Full', 'Grande suite', 'Yahtzee']);

function cooldown() {
  const remaining = Math.max(0, readyAt - performance.now());
  if (!remaining) readyAt = 0;
  const charging = phase >= 1 && remaining > 0;
  diceAction.disabled = campaignFinished || passageRequested || phase < 1 || charging;
  diceAction.classList.toggle('cooling', charging);
  diceAction.style.setProperty('--recharge', charging ? String(1 - remaining / diceCooldownMs) : '0');
}

function arrangedDice(values, hand) {
  const faces = [...new Set(values)].sort((a, b) => a - b);
  const matching = count => faces.filter(face => values.filter(value => value === face).length === count);
  let groups = [];

  switch (hand) {
    case 'Paire': groups = [Array(2).fill(matching(2)[0])]; break;
    case 'Double paire': groups = matching(2).map(face => [face, face]); break;
    case 'Brelan': groups = [Array(3).fill(matching(3)[0])]; break;
    case 'Carré': groups = [Array(4).fill(matching(4)[0])]; break;
    case 'Full': groups = [Array(3).fill(matching(3)[0]), Array(2).fill(matching(2)[0])]; break;
    case 'Yahtzee': groups = [values.slice()]; break;
    case 'Petite suite': {
      const start = faces.find(face => [face + 1, face + 2, face + 3].every(next => faces.includes(next)));
      groups = [[start, start + 1, start + 2, start + 3]];
      break;
    }
    case 'Grande suite': groups = [faces]; break;
  }

  const rest = values.slice();
  const ordered = groups.flatMap((group, index) => group.map(face => {
    rest.splice(rest.indexOf(face), 1);
    return { face, group: index + 1 };
  }));
  return ordered.concat(rest.map(face => ({ face, group: 0 })));
}

function showDice(values, hand) {
  showDigitalDice(values);
  const result = arrangedDice(values, hand);
  showOrbitalDice(result.map(({face}) => face));
  result.forEach(({ face, group }, index) => {
    const die = dice[index];
    setFace(die, face);
    die.dataset.group = String(group);
  });
  diceSummary.textContent = hand;
  diceAnnouncement.textContent = `${hand} — ${result.map(({face}) => face).join(', ')}`;
  diceResult.hidden = false;
  delete diceResult.dataset.celebration;
  if (rareFigures.has(hand)) {
    void diceResult.offsetWidth;
    diceResult.dataset.celebration = hand === 'Yahtzee' ? 'yahtzee' : 'rare';
  }
}

function showDigitalDice(values) {
  if (!digitalScreen) return;
  digitalScreen.hidden = false;
  digitalDice.forEach((die, index) => setFace(die, values[index]));
}

function showOrbitalDice(values) {
  if (!orbitalProjector) return;
  orbitalProjector.hidden = false;
  orbitalDice.forEach((die, index) => setFace(die, values[index]));
}

function resetDice(clearResult = true) {
  readyAt = 0;
  if (rollTimer !== null) clearInterval(rollTimer);
  rollTimer = null;
  if (!clearResult && !diceResult.classList.contains('rolling')) {
    cooldown();
    return;
  }
  diceResult.hidden = true;
  diceResult.classList.remove('rolling');
  delete diceResult.dataset.celebration;
  diceSummary.textContent = '';
  diceAnnouncement.textContent = '';
  if (digitalScreen) digitalScreen.hidden = true;
  if (orbitalProjector) {
    orbitalProjector.hidden = true;
    orbitalProjector.classList.remove('rolling');
  }
  cooldown();
}

function diceRoll() {
  if (campaignFinished || passageRequested || phase < 1 || readyAt > performance.now()) return;
  readyAt = performance.now() + diceCooldownMs;
  cooldown();
  if (rollTimer !== null) clearInterval(rollTimer);
  delete diceResult.dataset.celebration;
  dice.forEach(die => { die.dataset.group = '0'; });
  diceSummary.textContent = 'Lancer…';
  diceAnnouncement.textContent = '';
  diceResult.hidden = false;
  diceResult.classList.add('rolling');

  const rollFaces = () => dice.map(() => Math.floor(Math.random() * 6) + 1);
  let values = rollFaces();
  if (upgrades.luck && Math.random() < .15) {
    const second = rollFaces();
    if ((ranks[combination(second)] ?? 0) > (ranks[combination(values)] ?? 0)) values = second;
  }
  showDigitalDice(values);
  showOrbitalDice(values);
  orbitalProjector?.classList.add('rolling');
  const settleAt = performance.now() + (orbitalProjector ? 1040 : 650);
  rollTimer = setInterval(() => {
    if (performance.now() < settleAt) {
      const preview = rollFaces();
      preview.forEach((face, index) => setFace(dice[index], face));
      showDigitalDice(preview);
      showOrbitalDice(preview);
      return;
    }
    clearInterval(rollTimer);
    rollTimer = null;
    diceResult.classList.remove('rolling');
    orbitalProjector?.classList.remove('rolling');
    const hand = combination(values);
    const success = Boolean(ranks[hand]);
    showDice(values, hand);
    log('Dés : ' + values.join('-') + ' — ' + hand, 'dice', success);
    if (success) protectStamina(hand);
    completedRolls++;
    updateObjectives();
    if (!campaign && phase === 1 && ['Brelan', 'Full', 'Carré', 'Grande suite', 'Yahtzee'].includes(hand)) gotoPhase(2, 'dice');
  }, 65);
}

function updateObjectives() {
  if (!campaign) return;
  const counts = [Math.floor(steps / 10), knowledgeLevel, completedRolls];
  readyToAdvance = counts.every((count, index) => count >= targets[index]);
  objectiveHint.hidden = phase > 0;
  objectiveCounters.forEach((counter, index) => {
    counter.textContent = Math.min(counts[index], targets[index]) + ' / ' + targets[index];
    counter.dataset.done = String(counts[index] >= targets[index]);
  });
  objectiveAction.disabled = !readyToAdvance || passageRequested;
  objectiveAction.textContent = campaignFinished ? 'Nouvelle partie'
    : era.number === 5 ? 'Achever le voyage' : 'Passer à l’ère suivante';
  objectiveStatus.textContent = campaignFinished ? 'Campagne terminée. ' + era.progression.complete
    : readyToAdvance ? era.progression.complete : '';
}

function showObjectiveStudyTime(now) {

  const studying = studyEndAt > now;
  const available = knowledgeLevel < targets[1] && !campaignFinished && !passageRequested;
  objectiveStudyTime.hidden = !available || (!studying && studyReadyAt <= now);
  if (objectiveStudyTime.hidden) return;
  const text = studying ? 'Étude en cours · ' + Math.ceil((studyEndAt - now) / 1000) + ' s'
    : 'Reprise de l’étude dans ' + Math.ceil((studyReadyAt - now) / 1000) + ' s';
  if (objectiveStudyTime.textContent !== text) objectiveStudyTime.textContent = text;
}

objectiveAction.addEventListener('click', () => {
  if (!campaign || !readyToAdvance || passageRequested) return;
  if (campaignFinished) {
    passageRequested = true;
    updateObjectives();
    parent.postMessage({type: 'campaign-restart'}, '*');
    return;
  }
  if (era.number === 5) {
    campaignFinished = true;
    studyEndAt = 0;
    resetDice(false);
    log(era.progression.complete, 'lore', true);
    refresh();
    updateObjectives();
    return;
  }
  passageRequested = true;
  resetDice(false);
  updateObjectives();
  refresh();
  parent.postMessage({
    type: 'campaign-advance',
    character: {level, currentExp, vitality, intelligence, availableAttributePoints, availableTalentPoints, mana, manaUnlocked},
  }, '*');
});

const stationMenu = get('station-menu');
const stationTitle = get('station-title');
const stationDescription = get('station-description');
const stationStatus = get('station-status');
const stationOptions = get('station-options');
const stationResearch = get('station-research');
const stationStudies = get('station-studies');
const stationPassage = get('station-passage');
const antiqueUpgrades = era.number === 1;
let openStation;
let stationTrigger;
let studyMenuState;
let optionsMenuState;
let parts = 0;
let upgrades = {};
let autoWheelAt = 0;
let autoDiceAt = 0;

const upgradeGroups = {
  wheel: [
    {id:'speed', name:'Axe poli', cost:1, effect:'La rotation passe de 0,48 s à 0,26 s.'},
    {id:'force', name:'Levier de pierre', cost:1, effect:'Deux crans par pression pour le même coût en endurance.'},
    {id:'autoWheel', name:'Contrepoids', cost:2, effect:'Une pression toutes les 5 s, selon l’endurance disponible.', study:true},
  ],
  dice: [
    {id:'luck', name:'Seconde chance', cost:1, effect:'15 % de chance d’obtenir un second tirage. La meilleure figure compte.'},
    {id:'reward', name:'Offrande', cost:1, effect:'Les combinaisons prolongent la protection d’endurance de 5 s.'},
    {id:'autoDice', name:'Coupe à bascule', cost:2, effect:'Un lancer automatique dès que les dés sont rechargés.', study:true},
  ],
};

const upgradeRows = new Map();
if (antiqueUpgrades) {
  for (const upgrade of Object.values(upgradeGroups).flat()) {
    const row = document.createElement('div');
    row.className = 'station-option';
    const copy = document.createElement('div');
    const name = document.createElement('h3');
    name.textContent = upgrade.name;
    const effect = document.createElement('p');
    effect.textContent = upgrade.effect + (upgrade.study ? ' Une étude terminée requise.' : '');
    copy.append(name, effect);
    const button = document.createElement('button');
    button.type = 'button';
    button.addEventListener('click', () => {
      if (upgrades[upgrade.id] || campaignFinished || passageRequested || parts < upgrade.cost || (upgrade.study && !knowledgeLevel)) return;
      parts -= upgrade.cost;
      upgrades[upgrade.id] = true;
      if (upgrade.id === 'speed') wheelimage.style.setProperty('--wheel-duration', '.26s');
      refreshStationMenu();
    });
    row.append(copy, button);
    upgradeRows.set(upgrade.id, {row, button});
  }
}

function resetStationProgress() {
  parts = 0;
  upgrades = {};
  autoWheelAt = 0;
  autoDiceAt = 0;
  wheelimage.style.setProperty('--wheel-duration', '.48s');
  if (stationMenu.open) stationMenu.close();
}

function renderStudyMenu() {
  const now = performance.now();
  const studying = studyEndAt > now;
  const state = `${phase}:${knowledgeLevel}:${studying}`;
  if (state === studyMenuState) return;
  studyMenuState = state;
  stationStudies.replaceChildren();
  knowledgeStages.forEach(({label, text}, index) => {
    const item = document.createElement('li');
    const name = document.createElement('strong');
    const done = index < knowledgeLevel;
    const current = index === knowledgeLevel;
    item.dataset.state = done ? 'done' : 'pending';
    name.textContent = label;
    const detail = done ? text : current && studying ? 'Étude en cours.' : current && phase >= 1 ? 'À étudier.' : 'À débloquer.';
    item.append(name, ' · ' + detail);
    stationStudies.append(item);
  });
}

function refreshStationMenu() {
  if (!openStation) return;
  if (openStation === 'study') {
    renderStudyMenu();
    if (stationStatus.textContent !== studyHint.textContent) stationStatus.textContent = studyHint.textContent;
    return;
  }
  if (openStation === 'window') {
    const text = campaign ? objectiveStatus.textContent || 'Les objectifs de l’ère sont dans le panneau à droite.' : '';
    if (stationStatus.textContent !== text) stationStatus.textContent = text;
    stationStatus.hidden = !campaign;
    stationPassage.hidden = !campaign || objectiveAction.disabled;
    if (stationPassage.textContent !== objectiveAction.textContent) stationPassage.textContent = objectiveAction.textContent;
    return;
  }
  const status = [];
  if (antiqueUpgrades) status.push(parts + ' pièce' + (parts === 1 ? '' : 's') + ' d’atelier · 1 par tour complet');
  if (openStation === 'dice') {
    if (phase < 1) status.push('Le premier tour débloque les lancers.');
    else if (rollTimer !== null) status.push('Lancer en cours.');
    else if (readyAt > 0) status.push('Recharge · ' + Math.ceil((readyAt - performance.now()) / 1000) + ' s');
    else status.push('Dés disponibles.');
  }
  const text = status.join(' — ');
  if (stationStatus.textContent !== text) stationStatus.textContent = text;
  stationStatus.hidden = !text;
  if (!antiqueUpgrades) return;
  const state = [openStation, parts, knowledgeLevel, campaignFinished, passageRequested, ...Object.keys(upgrades)].join(':');
  if (state === optionsMenuState) return;
  optionsMenuState = state;
  for (const upgrade of upgradeGroups[openStation]) {
    const {button} = upgradeRows.get(upgrade.id);
    const bought = Boolean(upgrades[upgrade.id]);
    button.textContent = bought ? 'Acquise' : 'Acheter · ' + upgrade.cost;
    button.disabled = bought || campaignFinished || passageRequested || parts < upgrade.cost || (upgrade.study && !knowledgeLevel);
    button.setAttribute('aria-label', bought ? upgrade.name + ' acquise' : 'Acheter ' + upgrade.name + ' pour ' + upgrade.cost + ' pièce(s)');
  }
}

function runStationAutomation(now) {
  if (campaignFinished || passageRequested || document.hidden || stationMenu.open) return;
  if (upgrades.autoDice && now >= autoDiceAt && !diceAction.disabled) {
    autoDiceAt = now + diceCooldownMs;
    diceRoll();
  }
  if (upgrades.autoWheel && now >= autoWheelAt) {
    autoWheelAt = now + 5000;
    const canPay = phase === 0 || now < staminaProtectedUntil || stamina >= WHEEL_COST;
    if (canPay) stepWheel();
  }
}

stationPassage.addEventListener('click', () => {
  if (objectiveAction.disabled) return;
  stationMenu.close();
  objectiveAction.click();
});
stationMenu.addEventListener('close', () => {
  if (stationMenu.open) return;
  openStation = undefined;
  stationTrigger?.focus();
});
for (const [key, id] of Object.entries({wheel:'wheel-menu-zone', dice:'dice-menu-zone', study:'study-menu-zone', window:'window-menu-zone'})) {
  const zone = get(id);
  zone.addEventListener('click', () => {
    if (stationMenu.open) return;
    openStation = key;
    stationTrigger = zone;
    studyMenuState = undefined;
    optionsMenuState = undefined;
    const labels = {
      wheel: ['Roue', antiqueUpgrades ? 'Améliore la vitesse, la poussée ou l’entraînement de la roue.' : 'Vitesse, poussée et automatisation de la roue. Améliorations à définir pour cette ère.'],
      dice: ['Yahtzee · Chance', antiqueUpgrades ? 'Améliore les chances, la protection d’endurance ou le rythme des lancers.' : 'Chance, gains et automatisation des lancers. Améliorations à définir pour cette ère.'],
      study: ['Étude · ' + era.studyName, lore.inspectBook],
      window: ['Fenêtre', era.windowDescription + '.'],
    };
    [stationTitle.textContent, stationDescription.textContent] = labels[key];
    const rows = antiqueUpgrades ? (upgradeGroups[key] ?? []).map(({id}) => upgradeRows.get(id).row) : [];
    stationOptions.replaceChildren(...rows);
    stationOptions.hidden = rows.length === 0;
    stationResearch.hidden = key !== 'study';
    stationPassage.hidden = true;
    stationStatus.hidden = rows.length === 0 && key !== 'study';
    refreshStationMenu();
    stationMenu.showModal();
  });
}

function restart(){
 steps=0;clicks=0;phase=0;times=[];completedRolls=0;
 campaignFinished=false;passageRequested=false;
 resetResources();
 resetStationProgress();
 if(arrivalCharacter){
  ({level,currentExp,vitality,intelligence,availableAttributePoints,availableTalentPoints,mana,manaUnlocked}=arrivalCharacter);
  arrivalCharacter=null;
  renderResources();
 }
 resetDice();
 total.textContent='0';cps.textContent='0,0';
 journal.replaceChildren();
 wheelRender(true);
 refresh();
 log(lore.start);
 updateObjectives();
}
prev.addEventListener('click',()=>gotoPhase(phase-1,'cheat'));next.addEventListener('click',()=>gotoPhase(phase+1,'cheat'));reset.addEventListener('click',restart);

const wheelAction = get('antique-wheel-action');
const studyAction = get('antique-study-action');
const assembly = get('book-assembly');
wheelAction.addEventListener('click', stepWheel);
studyAction.addEventListener('click', startStudy);
diceAction.addEventListener('click', diceRoll);

function updateSceneActions() {
  const now = performance.now();
  const studying = studyEndAt > now;
  const recovering = studyReadyAt > now;
  wheelAction.hidden = false;
  wheelAction.disabled = campaignFinished || passageRequested;
  studyAction.hidden = phase < 1;
  diceAction.hidden = phase < 1;
  studyAction.disabled = campaignFinished || passageRequested || phase < 1 || studying || recovering || knowledgeLevel >= knowledgeStages.length;
  studyAction.title = studying ? 'Étude en cours' : recovering ? 'Étude en recharge' : `Étudier (${STUDY_COST} END)`;
  assembly.classList.toggle('study-active', studying);
}

setInterval(()=>{
 rate();cooldown();updateResources();completeStudy();renderStudy();updateSceneActions();
 runStationAutomation(performance.now());
 refreshStationMenu();
},100);
const examples = [
  ['Paire', [2, 6, 4, 2, 1]],
  ['Double paire', [4, 2, 6, 4, 2]],
  ['Brelan', [4, 2, 4, 5, 4]],
  ['Carré', [5, 5, 3, 5, 5]],
  ['Full', [3, 2, 3, 2, 2]],
  ['Petite suite', [5, 3, 2, 4, 2]],
  ['Grande suite', [5, 2, 4, 1, 3]],
  ['Yahtzee', [6, 6, 6, 6, 6]],
  ['Aucune combinaison', [1, 2, 3, 5, 6]]
];

function setupEssai() {
  if (reviewMode === 'partie' || campaign) return;

  const descriptions = {
    roue: ['Roue', 'Observe le disque, son axe et le bâti au fil des crans.'],
    papyrus: [era.studyName, 'Le test commence avec 10 points d’endurance.'],
    des: ['Décor complet', 'Essaie la roue, l’étude ou le Yahtzee.'],
    decor: ['Décor', 'La pièce éclairée, avec la roue au repos.'],
    interface: ['Interface', 'Change d’état de test pour voir les panneaux et les commandes qui apparaissent.']
  };
  const [title, description] = descriptions[reviewMode];
  const commands = get('essai-commandes');
  const status = get('essai-etat');
  get('essai-titre').textContent = title;
  get('essai-description').textContent = description;

  function action(label, handler) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.addEventListener('click', handler);
    commands.append(button);
    return button;
  }

  function watch(read, update) {
    let previous;
    const refreshStatus = () => {
      const next = read();
      if (next === previous) return;
      previous = next;
      status.textContent = next;
      update?.();
    };
    refreshStatus();
    setInterval(refreshStatus, 100);
  }

  switch (reviewMode) {
    case 'roue':
      action('Tourner la roue', () => wheelAction.click());
      action('Revenir au départ', () => {
        restart();
      });
      status.setAttribute('aria-live', 'polite');
      watch(() => `${steps} ${steps === 1 ? 'cran' : 'crans'} · ${steps * 36 % 360}° depuis le départ`);
      break;

    case 'papyrus': {
      gotoPhase(1, 'essai');
      stamina = maxStamina;
      renderResources();
      const study = action(era.studyAction, () => studyAction.click());
      watch(() => {
        const discovery = knowledgeStages[knowledgeLevel - 1];
        const note = discovery ? ` · ${discovery.label}. ${discovery.text}` : '';
        return `${studyHint.textContent} · Endurance ${fmt1(stamina)} / ${maxStamina}${note}`;
      }, () => {
        study.disabled = studyEndAt > performance.now() || studyReadyAt > performance.now() || knowledgeLevel >= knowledgeStages.length;
      });
      break;
    }

    case 'des': {
      gotoPhase(1, 'essai');
      stamina = maxStamina;
      renderResources();
      status.hidden = true;
      const [hand, faces] = examples[0];
      showDice(faces, hand);
      const roll = action('Lancer les cinq dés', diceRoll);
      const picker = document.createElement('select');
      picker.setAttribute('aria-label', 'Essayer une figure');
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.disabled = true;
      placeholder.textContent = 'Essayer une figure';
      picker.append(placeholder);
      examples.forEach(([name], index) => {
        const option = document.createElement('option');
        option.value = String(index);
        option.textContent = name;
        picker.append(option);
      });
      picker.value = '';
      picker.addEventListener('change', () => {
        if (picker.value === '' || rollTimer !== null) return;
        const [name, values] = examples[Number(picker.value)];
        showDice(values, name);
        picker.value = '';
      });
      commands.append(picker);
      watch(() => `${readyAt}:${rollTimer !== null}`, () => {
        roll.disabled = readyAt > performance.now();
        picker.disabled = rollTimer !== null;
      });
      break;
    }

    case 'decor':
      status.hidden = true;
      break;

    case 'interface': {
      function showPhase(target) {
        if (target === 0) restart();
        else gotoPhase(target, 'essai');
        phaseButtons.forEach((button, index) => button.setAttribute('aria-pressed', String(target === index)));
        effect.disabled = target === 0;
      }
      const phaseButtons = testStates.map((label, index) => action(label, () => showPhase(index)));
      const effect = action('Voir un effet temporaire', () => protectStamina('Brelan'));
      showPhase(0);
      status.hidden = true;
      break;
    }
  }
}

restart();
objectives.hidden = !campaign;
get('stamina-regen').textContent = '+' + fmt1(STAMINA_REGEN) + ' / sec';
setupEssai();
})();
</script>
