];

function setupEssai() {
  if (reviewMode === 'partie' || campaign) return;

  const descriptions = {
    roue: ['Roue', 'Observe le disque, son axe et le bâti au fil des crans.'],
    papyrus: [era.studyName, 'Le test commence avec 10 points d’endurance.'],
    des: ['Décor complet', 'Essaie la roue, l’étude ou le Yahtzee.'],
    decor: ['Décor', 'La pièce éclairée, avec la roue au repos.'],
    interface: ['Interface', 'Change d’état de test pour voir les panneaux et les commandes qui apparaissent.']
  };
  const [title, description] = descriptions[reviewMode];
  const commands = get('essai-commandes');
  const status = get('essai-etat');
  get('essai-titre').textContent = title;
  get('essai-description').textContent = description;

  function action(label, handler) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.addEventListener('click', handler);
    commands.append(button);
    return button;
  }

  function watch(read, update) {
    let previous;
    const refreshStatus = () => {
      const next = read();
      if (next === previous) return;
      previous = next;
      status.textContent = next;
      update?.();
    };
    refreshStatus();
    setInterval(refreshStatus, 100);
  }

  switch (reviewMode) {
    case 'roue':
      action('Tourner la roue', () => wheelAction.click());
      action('Revenir au départ', () => {
        restart();
      });
      status.setAttribute('aria-live', 'polite');
      watch(() => `${steps} ${steps === 1 ? 'cran' : 'crans'} · ${steps * 36 % 360}° depuis le départ`);
      break;

    case 'papyrus': {
      gotoPhase(1, 'essai');
      stamina = maxStamina;
      renderResources();
      const study = action(era.studyAction, () => studyAction.click());
      watch(() => {
        const discovery = knowledgeStages[knowledgeLevel - 1];
        const note = discovery ? ` · ${discovery.label}. ${discovery.text}` : '';
        return `${studyHint.textContent} · Endurance ${fmt1(stamina)} / ${maxStamina}${note}`;
      }, () => {
        study.disabled = studyEndAt > performance.now() || studyReadyAt > performance.now() || knowledgeLevel >= knowledgeStages.length;
      });
      break;
    }

    case 'des': {
      gotoPhase(1, 'essai');
      stamina = maxStamina;
      renderResources();
      status.hidden = true;
      const [hand, faces] = examples[0];
      showDice(faces, hand);
      const roll = action('Lancer les cinq dés', diceRoll);
      const picker = document.createElement('select');
      picker.setAttribute('aria-label', 'Essayer une figure');
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.disabled = true;
      placeholder.textContent = 'Essayer une figure';
      picker.append(placeholder);
      examples.forEach(([name], index) => {
        const option = document.createElement('option');
        option.value = String(index);
        option.textContent = name;
        picker.append(option);
      });
      picker.value = '';
      picker.addEventListener('change', () => {
        if (picker.value === '' || rollTimer !== null) return;
        const [name, values] = examples[Number(picker.value)];
        showDice(values, name);
        picker.value = '';
      });
      commands.append(picker);
      watch(() => `${readyAt}:${rollTimer !== null}`, () => {
        roll.disabled = readyAt > performance.now();
        picker.disabled = rollTimer !== null;
      });
      break;
    }

    case 'decor':
      status.hidden = true;
      break;

    case 'interface': {
      function showPhase(target) {
        if (target === 0) restart();
        else gotoPhase(target, 'essai');
        phaseButtons.forEach((button, index) => button.setAttribute('aria-pressed', String(target === index)));
        effect.disabled = target === 0;
      }
      const phaseButtons = testStates.map((label, index) => action(label, () => showPhase(index)));
      const effect = action('Voir un effet temporaire', () => protectStamina('Brelan'));
      showPhase(0);
      status.hidden = true;
      break;
    }
  }
}

restart();
objectives.hidden = !campaign;
get('stamina-regen').textContent = '+' + fmt1(STAMINA_REGEN) + ' / sec';
setupEssai();
})();

  <script>
    const views = [...document.querySelectorAll('[data-view]')];
    const preview = document.getElementById('apercus');
    const eraPicker = document.getElementById('atelier-era-select');
    const eraLabel = document.getElementById('atelier-era');
    const eras = new Map(Object.entries({"antique":{"label":"Antiquité","studyName":"Papyrus"},"medieval":{"label":"Moyen Âge","studyName":"Grimoire"},"industrial":{"label":"Moderne et contemporaine","studyName":"Plans"},"ai":{"label":"Ère de l’IA","studyName":"Ordinateur"},"future":{"label":"Futuriste","studyName":"Sphère"}}));
    const campaignEras = [...eras.keys()];
    const fullGames = new Map();
    let era = eraPicker.value;
    let campaignIndex = 0;
    let campaignFrame;
    let active;
    let selectedView;

    function createFrame(view, scene, character, hidden = false) {
      const frame = document.createElement('iframe');
      const styles = document.getElementById('styles-' + scene).innerHTML;
      const game = document.getElementById('jeu-' + scene).innerHTML;
      frame.title = view === 'campagne' ? 'Campagne' : `${selectedView.textContent} · ${eras.get(scene).label}`;
      frame.dataset.view = view;
      frame.dataset.era = scene;
      frame.hidden = hidden;
      frame.setAttribute('sandbox', 'allow-scripts');
      const carry = character ? ` data-character="${encodeURIComponent(JSON.stringify(character))}"` : '';
      frame.srcdoc = `<!doctype html><html lang="fr" data-essai="${view}"${carry}><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${frame.title}</title>${styles}</head><body>${game}</body></html>`;
      preview.append(frame);
      return frame;
    }

    function showView(button) {
      const view = button.dataset.view;
      const scene = view === 'campagne' ? campaignEras[campaignIndex] : era;
      if (active?.dataset.view === view && active.dataset.era === scene) return;
      if (['partie', 'campagne'].includes(active?.dataset.view)) active.hidden = true;
      else active?.remove();

      selectedView = button;
      eraLabel.hidden = view === 'partie' || view === 'campagne';
      const info = eras.get(era);
      views.find(item => item.dataset.view === 'papyrus').textContent = info.studyName;
      active = view === 'campagne' ? campaignFrame : view === 'partie' ? fullGames.get(era) : null;
      if (active) active.hidden = false;
      else {
        active = createFrame(view, scene);
        if (view === 'partie') fullGames.set(era, active);
        if (view === 'campagne') campaignFrame = active;
      }
      views.forEach(viewButton => viewButton.setAttribute('aria-pressed', String(viewButton === button)));
    }

    function changeEra(nextEra) {
      if (!eras.has(nextEra) || nextEra === era) return;
      era = nextEra;
      eraPicker.value = nextEra;
      showView(selectedView);
    }

    views.forEach(button => button.addEventListener('click', () => showView(button)));
    eraPicker.addEventListener('change', () => changeEra(eraPicker.value));
    window.addEventListener('message', event => {
      if (active?.dataset.view === 'partie' && event.source === active.contentWindow && event.data?.type === 'prototype-era') {
        changeEra(event.data.era);
        return;
      }
      if (!campaignFrame || event.source !== campaignFrame.contentWindow) return;
      const {type, character} = event.data ?? {};
      if (type === 'campaign-advance' && campaignIndex < campaignEras.length - 1) campaignIndex++;
      else if (type === 'campaign-restart' && campaignIndex === campaignEras.length - 1) campaignIndex = 0;
      else return;
      const visible = active === campaignFrame;
      campaignFrame.remove();
      campaignFrame = createFrame('campagne', campaignEras[campaignIndex], character, !visible);
      if (visible) active = campaignFrame;
    });
    showView(views[0]);
  </script>
