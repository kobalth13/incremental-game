<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeu — V0.1</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #fff;
    }
    body {
      display: grid;
      place-items: center;
    }
    button {
      padding: 3px 10px;
      border: 1px solid #888;
      border-radius: 2px;
      background: #efefef;
      color: #000;
      font: 14px Arial, sans-serif;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="bouton" type="button">Cliquer</button>
  <script>
    document.getElementById("bouton").addEventListener("click", function () {
      this.textContent = "Cliqué !";
    });
  </script>
</body>
</html>
