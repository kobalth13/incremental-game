<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeu — V0.2</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #fff;
    }
    body {
      display: grid;
      place-items: center;
    }
    #compteur {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: #000;
      font: 16px Arial, sans-serif;
      white-space: nowrap;
    }
    button {
      padding: 3px 10px;
      border: 1px solid #888;
      border-radius: 2px;
      background: #efefef;
      color: #000;
      font: 14px Arial, sans-serif;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="compteur" aria-live="polite">Clics : 0</div>
  <button id="bouton" type="button">Cliquer</button>
  <script>
    let clics = 0;
    const compteur = document.getElementById("compteur");
    document.getElementById("bouton").addEventListener("click", function () {
      clics += 1;
      compteur.textContent = "Clics : " + clics;
      this.textContent = "Cliqué !";
    });
  </script>
</body>
</html>
