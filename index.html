<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeu — V0.3</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #fff;
    }
    body {
      display: grid;
      place-items: center;
    }
    #compteur {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: #000;
      font: 16px Arial, sans-serif;
      white-space: nowrap;
    }
    button {
      display: grid;
      place-items: center;
      width: 112px;
      height: 112px;
      padding: 0;
      border: 4px solid #a7adb1;
      border-radius: 50%;
      color: #30343a;
      font: 600 14px Arial, sans-serif;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.75);
      cursor: pointer;
      background:
        radial-gradient(circle at 34% 25%, rgba(255,255,255,0.72), transparent 46%),
        repeating-radial-gradient(circle, rgba(255,255,255,0.15) 0px, rgba(255,255,255,0.15) 1px, rgba(30,36,40,0.08) 2px, rgba(30,36,40,0.08) 3px),
        conic-gradient(from -35deg, #a7acaf, #e8ebed, #9aa1a6, #f3f5f5, #a5abae, #dce0e1, #a7acaf);
      box-shadow:
        inset 0 2px 4px rgba(255,255,255,0.9),
        inset 0 -5px 8px rgba(44,52,58,0.25),
        0 4px 9px rgba(0,0,0,0.20),
        0 1px 2px rgba(0,0,0,0.14);
      transition: transform 90ms ease, box-shadow 90ms ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover {
      box-shadow:
        inset 0 2px 4px rgba(255,255,255,0.95),
        inset 0 -5px 8px rgba(44,52,58,0.25),
        0 6px 12px rgba(0,0,0,0.22);
    }
    button:active {
      transform: translateY(2px);
      box-shadow:
        inset 0 3px 9px rgba(37,43,48,0.30),
        inset 0 -1px 3px rgba(255,255,255,0.45),
        0 1px 3px rgba(0,0,0,0.18);
    }
    button:focus-visible {
      outline: 3px solid #424950;
      outline-offset: 5px;
    }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <div id="compteur" aria-live="polite">Clics : 0</div>
  <button id="bouton" type="button">Cliquer</button>
  <script>
    let clics = 0;
    const compteur = document.getElementById("compteur");
    document.getElementById("bouton").addEventListener("click", function () {
      clics += 1;
      compteur.textContent = "Clics : " + clics;
      this.textContent = "Cliqué !";
    });
  </script>
</body>
</html>
